<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>이용원 · Infrastructure & Security Engineer</title>
    <meta name="description" content="문제를 정의하고 기술로 해결하는 인프라·보안 엔지니어 이용원의 포트폴리오">

    <!-- Pretendard (Apple/Toss-like Korean type) -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        :root {
            /* Brand */
            --brand: #2563EB;
            --brand-strong: #1D4FD7;
            --brand-ink: #1B4DD1;
            --brand-tint: #EAF1FE;
            /* Ink (blue-tinted neutrals) */
            --ink: #0E1726;
            --ink-2: #51607A;
            --ink-3: #98A2B3;
            /* Surface */
            --bg: #F6F8FB;
            --surface: #FFFFFF;
            --line: #ECEFF4;
            --radius-card: 16px;
            --radius-btn: 12px;
        }

        * { box-sizing: border-box; }

        html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

        body {
            margin: 0;
            font-family: Pretendard, -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", sans-serif;
            color: var(--ink);
            background-color: var(--bg);
            /* subtle brand-hue ambience */
            background-image:
                radial-gradient(70rem 40rem at 50% -10%, rgba(37,99,235,.10), transparent 60%),
                radial-gradient(40rem 30rem at 100% 10%, rgba(37,99,235,.06), transparent 55%);
            background-repeat: no-repeat;
            line-height: 1.65;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        a { color: inherit; text-decoration: none; }

        .wrap {
            max-width: 760px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ---------- Sections ---------- */
        section { margin-top: 80px; }

        .eyebrow {
            font-size: 0.8125rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--brand-ink);
            margin: 0 0 20px;
        }

        /* ---------- Hero ---------- */
        header.hero { padding-top: 88px; }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            background: var(--brand-tint);
            color: var(--brand-ink);
            font-size: 0.8125rem;
            font-weight: 600;
            border-radius: 999px;
            line-height: 1.4;
        }

        .hero h1 {
            font-size: clamp(2.4rem, 7vw, 3.5rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.1;
            margin: 22px 0 10px;
        }

        .hero .title {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--ink-2);
            margin: 0 0 28px;
        }

        .actions { display: flex; flex-wrap: wrap; gap: 10px; }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: 48px;
            padding: 0 20px;
            border-radius: var(--radius-btn);
            font-size: 0.9375rem;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid transparent;
            transition: transform .15s cubic-bezier(.2,.8,.2,1), background-color .15s, border-color .15s;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: var(--brand); color: #fff; }
        .btn-primary:hover { background: var(--brand-strong); }
        .btn-ghost { background: var(--surface); color: var(--ink); border-color: var(--line); }
        .btn-ghost:hover { border-color: #D7DDE7; }
        .btn:focus-visible { outline: 3px solid rgba(37,99,235,.4); outline-offset: 2px; }

        /* ---------- About ---------- */
        .about-lead {
            font-size: clamp(1.25rem, 3.4vw, 1.6rem);
            font-weight: 700;
            letter-spacing: -0.01em;
            line-height: 1.45;
            color: var(--ink);
            margin: 0 0 24px;
        }
        .about-body {
            font-size: 1rem;
            color: var(--ink-2);
            white-space: pre-line;
            margin: 0;
        }

        /* ---------- Cards ---------- */
        .card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-card);
            padding: 24px;
            transition: transform .2s cubic-bezier(.2,.8,.2,1), border-color .2s;
        }
        .card + .card { margin-top: 16px; }
        .card:hover { transform: translateY(-2px); border-color: #DCE3EE; }

        .proj-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            flex-wrap: wrap;
        }
        .proj-title { font-size: 1.25rem; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
        .chip {
            flex-shrink: 0;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--ink-2);
            background: var(--bg);
            border: 1px solid var(--line);
            padding: 5px 10px;
            border-radius: 999px;
            white-space: nowrap;
        }
        .proj-desc { font-size: 1rem; font-weight: 600; color: var(--ink); margin: 14px 0 16px; }
        .points { list-style: none; padding: 0; margin: 0 0 18px; display: grid; gap: 10px; }
        .points li { display: flex; gap: 10px; font-size: 0.9375rem; color: var(--ink-2); }
        .points li i { color: var(--brand); margin-top: 4px; font-size: 0.75rem; flex-shrink: 0; }

        .repo-link {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-size: 0.875rem;
            font-weight: 700;
            color: var(--brand-ink);
            transition: gap .15s;
        }
        .repo-link:hover { gap: 11px; }

        /* ---------- Awards ---------- */
        .awards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .award {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 16px 18px;
        }
        .award .a-title { font-size: 0.9375rem; font-weight: 700; margin: 0; line-height: 1.35; }
        .award .a-org { font-size: 0.75rem; color: var(--ink-3); margin: 3px 0 0; }
        .award .a-date { font-size: 0.75rem; color: var(--ink-3); white-space: nowrap; flex-shrink: 0; }

        /* ---------- Tech ---------- */
        .tech { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .tech-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-card);
            padding: 22px 12px;
            transition: transform .2s cubic-bezier(.2,.8,.2,1), border-color .2s;
        }
        .tech-item:hover { transform: translateY(-2px); border-color: #DCE3EE; }
        .tech-item img, .tech-item svg { height: 40px; width: 40px; object-fit: contain; }
        .tech-item span { font-size: 0.8125rem; font-weight: 600; color: var(--ink-2); text-align: center; }

        /* ---------- Footer ---------- */
        footer {
            margin-top: 96px;
            padding: 32px 0 56px;
            border-top: 1px solid var(--line);
            text-align: center;
        }
        footer p { font-size: 0.8125rem; color: var(--ink-3); margin: 0; }

        /* ---------- Toast ---------- */
        .toast {
            position: fixed;
            left: 50%;
            bottom: 28px;
            transform: translate(-50%, 20px);
            background: rgba(14,23,38,.92);
            color: #fff;
            font-size: 0.9375rem;
            font-weight: 600;
            padding: 13px 20px;
            border-radius: 14px;
            box-shadow: 0 12px 32px rgba(14,23,38,.28);
            backdrop-filter: saturate(180%) blur(12px);
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s, transform .25s cubic-bezier(.2,.8,.2,1);
            z-index: 50;
        }
        .toast.show { opacity: 1; transform: translate(-50%, 0); }

        /* ---------- Scroll reveal ---------- */
        .reveal { opacity: 0; transform: translateY(16px); transition: opacity .6s ease, transform .6s cubic-bezier(.2,.8,.2,1); }
        .reveal.in { opacity: 1; transform: none; }

        /* ---------- Mobile ---------- */
        @media (max-width: 767px) {
            .wrap { padding: 0 20px; }
            header.hero { padding-top: 56px; }
            section { margin-top: 64px; }
            .awards { grid-template-columns: 1fr; }
            .actions .btn { flex: 1; height: 52px; justify-content: center; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { scroll-behavior: auto !important; }
            .reveal { opacity: 1 !important; transform: none !important; transition: none; }
            .btn:active, .card:hover, .tech-item:hover { transform: none; }
        }
        @media (prefers-reduced-transparency: reduce) {
            .toast { backdrop-filter: none; background: #0E1726; }
        }
    </style>
</head>
<body>
    <div class="wrap" id="app"></div>
    <div class="toast" id="toast"></div>

    <script src="js/data.js?v=6"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const app = document.getElementById('app');
            if (typeof resumeData === 'undefined') {
                app.innerHTML = '<p style="text-align:center;padding:80px 0;color:#51607A">데이터를 불러올 수 없어요. (js/data.js 확인 필요)</p>';
                return;
            }
            const d = resumeData;
            const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

            app.innerHTML = `
                <header class="hero reveal">
                    <span class="pill"><i class="fas fa-bolt"></i> ${esc(d.profile.keyword)}</span>
                    <h1>${esc(d.profile.name)}</h1>
                    <p class="title">${esc(d.profile.title)}</p>
                    <div class="actions">
                        <button class="btn btn-primary" id="copyEmail" data-email="${esc(d.profile.email)}">
                            <i class="fas fa-envelope"></i> 이메일 복사
                        </button>
                        <a class="btn btn-ghost" href="https://github.com/${esc(d.profile.github)}" target="_blank" rel="noopener">
                            <i class="fab fa-github"></i> GitHub
                        </a>
                    </div>
                </header>

                <section class="reveal">
                    <p class="eyebrow">About</p>
                    <p class="about-lead">"${esc(d.profile.summary)}"</p>
                    <p class="about-body">${esc((d.profile.fullIntro || '').trim())}</p>
                </section>

                <section class="reveal">
                    <p class="eyebrow">Projects</p>
                    ${d.projects.map(pj => `
                        <article class="card">
                            <div class="proj-head">
                                <h3 class="proj-title">${esc(pj.title)}</h3>
                                <span class="chip">${esc(pj.period)}</span>
                            </div>
                            <p class="proj-desc">${esc(pj.description)}</p>
                            <ul class="points">
                                ${pj.points.map(pt => `<li><i class="fas fa-check"></i><span>${esc(pt)}</span></li>`).join('')}
                            </ul>
                            ${pj.link && pj.link !== '#' ? `<a class="repo-link" href="${esc(pj.link)}" target="_blank" rel="noopener">GitHub Repository <i class="fas fa-arrow-right"></i></a>` : ''}
                        </article>
                    `).join('')}
                </section>

                <section class="reveal">
                    <p class="eyebrow">Awards</p>
                    <div class="awards">
                        ${d.awards.map(aw => `
                            <div class="award">
                                <div>
                                    <p class="a-title">${esc(aw.title)}</p>
                                    <p class="a-org">${esc(aw.org)}</p>
                                </div>
                                <span class="a-date">${esc(aw.date)}</span>
                            </div>
                        `).join('')}
                    </div>
                </section>

                <section class="reveal">
                    <p class="eyebrow">Tech Stack</p>
                    <div class="tech">
                        ${d.techStack.map(t => {
                            const icon = t.svg
                                ? t.svg.replace('<svg', '<svg height="40" width="40"')
                                : `<img src="${esc(t.img)}" alt="${esc(t.name)}" loading="lazy" onerror="this.style.opacity=.25">`;
                            return `<div class="tech-item">${icon}<span>${esc(t.name)}</span></div>`;
                        }).join('')}
                    </div>
                </section>

                <footer>
                    <p>Last Deployed · <span id="deploy-timestamp">2026-06-25T05:07:09Z</span></p>
                </footer>
            `;

            // Email copy -> toast
            const toast = document.getElementById('toast');
            let toastTimer;
            const showToast = (msg) => {
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
            };
            const copyBtn = document.getElementById('copyEmail');
            copyBtn?.addEventListener('click', async () => {
                const email = copyBtn.dataset.email;
                try {
                    await navigator.clipboard.writeText(email);
                    showToast('이메일을 복사했어요 ✓');
                } catch {
                    showToast(email);
                }
            });

            // Scroll reveal
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                const io = new IntersectionObserver((entries) => {
                    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
                }, { threshold: 0.12 });
                document.querySelectorAll('.reveal').forEach(el => io.observe(el));
            } else {
                document.querySelectorAll('.reveal').forEach(el => el.classList.add('in'));
            }
        });
    </script>
</body>
</html>
