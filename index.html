<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>iamywl · Infrastructure &amp; Security Architect</title>
    <meta name="description" content="Linux Kernel 6.x & eBPF, Kubernetes Multi-Cluster, Cloud Native & DevSecOps 시스템 아키텍트 iamywl의 엔지니어링 포트폴리오">

    <!-- Pretendard Font & FontAwesome Icons -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        /* ------------------------------------------------------------------
           Pure Minimalist Monochrome & Zinc Tokens (Zero Blue Palette)
        ------------------------------------------------------------------ */
        :root {
            /* Light Theme: Pure Monochrome & Apple Keynote Minimal */
            --bg-page: #FAFAFA;
            --bg-card: #FFFFFF;
            --bg-card-subtle: #F4F4F5;
            --border-default: #E4E4E7;
            --border-subtle: #F4F4F5;
            --border-hover: #71717A;

            --text-primary: #09090B;
            --text-secondary: #27272A;
            --text-tertiary: #52525B;
            --text-muted: #71717A;

            --btn-primary-bg: #09090B;
            --btn-primary-text: #FFFFFF;
            --btn-primary-hover: #27272A;

            --btn-secondary-bg: #FFFFFF;
            --btn-secondary-text: #09090B;
            --btn-secondary-border: #E4E4E7;
            --btn-secondary-hover: #F4F4F5;

            --topbar-bg: rgba(250, 250, 250, 0.92);
            --topbar-border: #E4E4E7;

            --chip-bg: #F4F4F5;
            --chip-text: #27272A;
            --chip-border: #E4E4E7;

            --tag-accent-bg: #09090B;
            --tag-accent-text: #FFFFFF;

            --featured-card-bg: #F4F4F5;
            --featured-card-border: #D4D4D8;

            --metric-color: #09090B;

            --card-shadow: 0 1px 3px rgba(0, 0, 0, 0.04), 0 4px 12px rgba(0, 0, 0, 0.02);
            --card-shadow-hover: 0 8px 24px -4px rgba(0, 0, 0, 0.08), 0 2px 6px -1px rgba(0, 0, 0, 0.03);
        }

        [data-theme="dark"] {
            /* Dark Theme: Pure Obsidian & Platinum Monochrome */
            --bg-page: #09090B;
            --bg-card: #121215;
            --bg-card-subtle: #1C1C20;
            --border-default: #27272A;
            --border-subtle: #1C1C20;
            --border-hover: #52525B;

            --text-primary: #FAFAFA;
            --text-secondary: #E4E4E7;
            --text-tertiary: #A1A1AA;
            --text-muted: #71717A;

            --btn-primary-bg: #FAFAFA;
            --btn-primary-text: #09090B;
            --btn-primary-hover: #E4E4E7;

            --btn-secondary-bg: #121215;
            --btn-secondary-text: #FAFAFA;
            --btn-secondary-border: #27272A;
            --btn-secondary-hover: #1C1C20;

            --topbar-bg: rgba(9, 9, 11, 0.92);
            --topbar-border: #27272A;

            --chip-bg: #1C1C20;
            --chip-text: #E4E4E7;
            --chip-border: #27272A;

            --tag-accent-bg: #FAFAFA;
            --tag-accent-text: #09090B;

            --featured-card-bg: #16161A;
            --featured-card-border: #3F3F46;

            --metric-color: #FAFAFA;

            --card-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
            --card-shadow-hover: 0 10px 28px rgba(0, 0, 0, 0.7);
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg-page: #09090B;
                --bg-card: #121215;
                --bg-card-subtle: #1C1C20;
                --border-default: #27272A;
                --border-subtle: #1C1C20;
                --border-hover: #52525B;

                --text-primary: #FAFAFA;
                --text-secondary: #E4E4E7;
                --text-tertiary: #A1A1AA;
                --text-muted: #71717A;

                --btn-primary-bg: #FAFAFA;
                --btn-primary-text: #09090B;
                --btn-primary-hover: #E4E4E7;

                --btn-secondary-bg: #121215;
                --btn-secondary-text: #FAFAFA;
                --btn-secondary-border: #27272A;
                --btn-secondary-hover: #1C1C20;

                --topbar-bg: rgba(9, 9, 11, 0.92);
                --topbar-border: #27272A;

                --chip-bg: #1C1C20;
                --chip-text: #E4E4E7;
                --chip-border: #27272A;

                --tag-accent-bg: #FAFAFA;
                --tag-accent-text: #09090B;

                --featured-card-bg: #16161A;
                --featured-card-border: #3F3F46;

                --metric-color: #FAFAFA;

                --card-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
                --card-shadow-hover: 0 10px 28px rgba(0, 0, 0, 0.7);
            }
        }

        /* ------------------------------------------------------------------
           Base Typography & Layout Reset
        ------------------------------------------------------------------ */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            line-height: 1.65;
            letter-spacing: -0.025em;
            word-break: keep-all;
            overflow-wrap: break-word;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            transition: background-color .2s ease, color .2s ease;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .container {
            max-width: 760px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ------------------------------------------------------------------
           Navigation Topbar
        ------------------------------------------------------------------ */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 50;
            background: var(--topbar-bg);
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--topbar-border);
            transition: background .2s, border-color .2s;
        }
        .topbar .inner {
            max-width: 760px;
            margin: 0 auto;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .topbar-brand {
            font-weight: 800;
            font-size: 1.05rem;
            letter-spacing: -0.03em;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .topbar-brand-badge {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-secondary);
            background: var(--chip-bg);
            border: 1px solid var(--chip-border);
            padding: 2px 7px;
            border-radius: 6px;
        }
        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            color: var(--text-secondary);
            border: 1px solid transparent;
            background: transparent;
            cursor: pointer;
            transition: background .15s, color .15s;
            -webkit-tap-highlight-color: transparent;
        }
        .icon-btn:hover {
            background: var(--bg-card-subtle);
            color: var(--text-primary);
        }
        .icon-btn:active {
            transform: scale(0.94);
        }

        /* ------------------------------------------------------------------
           Hero Section (Authoritative Monochrome)
        ------------------------------------------------------------------ */
        .hero {
            padding-top: 56px;
            padding-bottom: 40px;
        }
        .hero-tag {
            display: inline-flex;
            align-items: center;
            font-size: 0.8125rem;
            font-weight: 700;
            color: var(--text-tertiary);
            margin-bottom: 12px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .hero-title {
            font-size: clamp(2.2rem, 5.5vw, 3.2rem);
            font-weight: 800;
            letter-spacing: -0.035em;
            line-height: 1.15;
            color: var(--text-primary);
            margin-bottom: 12px;
        }
        .hero-role {
            font-size: clamp(1.15rem, 2.8vw, 1.35rem);
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 16px;
            letter-spacing: -0.02em;
        }
        .hero-desc {
            font-size: 1.05rem;
            font-weight: 500;
            line-height: 1.7;
            color: var(--text-tertiary);
            max-width: 58ch;
            margin-bottom: 28px;
        }
        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 46px;
            padding: 0 20px;
            border-radius: 12px;
            font-size: 0.9375rem;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid transparent;
            transition: background-color .15s, transform .12s, border-color .15s;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn-primary {
            background-color: var(--btn-primary-bg);
            color: var(--btn-primary-text);
        }
        .btn-primary:hover {
            background-color: var(--btn-primary-hover);
        }
        .btn-secondary {
            background-color: var(--btn-secondary-bg);
            color: var(--btn-secondary-text);
            border: 1px solid var(--btn-secondary-border);
        }
        .btn-secondary:hover {
            background-color: var(--btn-secondary-hover);
        }

        /* ------------------------------------------------------------------
           Section Common
        ------------------------------------------------------------------ */
        section {
            margin-top: 56px;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 18px;
        }
        .section-title {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            color: var(--text-primary);
        }
        .section-count {
            font-size: 0.84rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        /* ------------------------------------------------------------------
           Key Metrics (4 Solid Monochrome Cards)
        ------------------------------------------------------------------ */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .metric-card {
            background: var(--bg-card);
            border: 1px solid var(--border-default);
            border-radius: 14px;
            padding: 20px 14px;
            text-align: center;
            box-shadow: var(--card-shadow);
            transition: border-color .15s, transform .15s;
        }
        .metric-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-2px);
        }
        .metric-value {
            font-size: clamp(1.6rem, 3.8vw, 2.1rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.1;
            color: var(--metric-color);
            margin-bottom: 6px;
        }
        .metric-label {
            font-size: 0.78125rem;
            font-weight: 600;
            color: var(--text-tertiary);
            line-height: 1.35;
        }

        /* ------------------------------------------------------------------
           About & Engineering Philosophy Card
        ------------------------------------------------------------------ */
        .card-panel {
            background: var(--bg-card);
            border: 1px solid var(--border-default);
            border-radius: 16px;
            padding: 28px 30px;
            box-shadow: var(--card-shadow);
        }
        .about-quote {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            margin-bottom: 16px;
            line-height: 1.55;
        }
        .about-text p {
            font-size: 0.96875rem;
            font-weight: 400;
            line-height: 1.8;
            color: var(--text-secondary);
            margin-bottom: 14px;
        }
        .about-text p:last-child {
            margin-bottom: 0;
        }

        /* ------------------------------------------------------------------
           Flagship Project Cards
        ------------------------------------------------------------------ */
        .project-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .project-card {
            background: var(--bg-card);
            border: 1px solid var(--border-default);
            border-radius: 16px;
            padding: 26px 28px;
            box-shadow: var(--card-shadow);
            transition: border-color .2s, transform .2s, box-shadow .2s;
        }
        .project-card:hover {
            border-color: var(--border-hover);
            box-shadow: var(--card-shadow-hover);
            transform: translateY(-2px);
        }
        .project-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 10px;
        }
        .badge-pill {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--chip-text);
            background: var(--chip-bg);
            border: 1px solid var(--chip-border);
            padding: 3px 9px;
            border-radius: 6px;
            letter-spacing: -0.01em;
        }
        .project-date {
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--text-muted);
        }
        .project-title {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            color: var(--text-primary);
            margin-bottom: 8px;
            line-height: 1.35;
        }
        .project-summary {
            font-size: 0.96875rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 18px;
            line-height: 1.6;
        }
        .project-bullets {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 9px;
            margin-bottom: 20px;
            padding-left: 2px;
        }
        .project-bullets li {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 0.9375rem;
            line-height: 1.6;
            color: var(--text-secondary);
        }
        .project-bullets li::before {
            content: "•";
            color: var(--text-muted);
            font-weight: bold;
            font-size: 1.1rem;
            line-height: 1.4;
            flex-shrink: 0;
        }
        .project-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.90625rem;
            font-weight: 700;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border-default);
            padding-bottom: 2px;
            transition: border-color .15s, gap .15s;
        }
        .project-link:hover {
            gap: 10px;
            border-color: var(--text-primary);
        }

        /* ------------------------------------------------------------------
           Honors & Awards (Resume Dossier Format - Zero Blue)
        ------------------------------------------------------------------ */
        .awards-container {
            background: var(--bg-card);
            border: 1px solid var(--border-default);
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            overflow: hidden;
        }
        .award-item {
            padding: 22px 26px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 18px;
            border-bottom: 1px solid var(--border-subtle);
            transition: background-color .15s;
        }
        .award-item:last-child {
            border-bottom: none;
        }
        .award-item:hover {
            background-color: var(--bg-card-subtle);
        }
        .award-item.featured {
            background-color: var(--featured-card-bg);
            border-bottom: 1px solid var(--featured-card-border);
        }
        .award-main {
            flex: 1;
            min-width: 0;
        }
        .award-title-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 5px;
        }
        .award-title {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }
        .award-item.featured .award-title {
            font-size: 1.08rem;
            font-weight: 800;
        }
        .award-badge {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--tag-accent-text);
            background: var(--tag-accent-bg);
            border: 1px solid transparent;
            padding: 2px 7px;
            border-radius: 5px;
            white-space: nowrap;
        }
        .award-org {
            font-size: 0.84rem;
            font-weight: 500;
            color: var(--text-tertiary);
        }
        .award-desc {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-top: 6px;
            line-height: 1.5;
        }
        .award-date {
            font-size: 0.84rem;
            font-weight: 600;
            color: var(--text-muted);
            white-space: nowrap;
            flex-shrink: 0;
            padding-top: 2px;
        }

        /* ------------------------------------------------------------------
           Technical Arsenal (Bento Architecture)
        ------------------------------------------------------------------ */
        .tech-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .tech-card {
            background: var(--bg-card);
            border: 1px solid var(--border-default);
            border-radius: 14px;
            padding: 20px 22px;
            box-shadow: var(--card-shadow);
        }
        .tech-card-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
        }
        .tech-card-icon {
            font-size: 0.95rem;
            color: var(--text-secondary);
        }
        .tech-card-title {
            font-size: 0.96875rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.015em;
        }
        .tech-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
        }
        .tech-chip {
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--chip-text);
            background: var(--chip-bg);
            border: 1px solid var(--chip-border);
            padding: 4px 10px;
            border-radius: 6px;
            white-space: nowrap;
        }

        /* ------------------------------------------------------------------
           Footer
        ------------------------------------------------------------------ */
        footer {
            margin-top: 72px;
            padding: 32px 0 64px;
            border-top: 1px solid var(--border-default);
            text-align: center;
        }
        footer p {
            font-size: 0.8125rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        /* ------------------------------------------------------------------
           Toast Notification
        ------------------------------------------------------------------ */
        .toast {
            position: fixed;
            left: 50%;
            bottom: 30px;
            transform: translate(-50%, 20px);
            background: var(--text-primary);
            color: var(--bg-card);
            font-size: 0.90625rem;
            font-weight: 600;
            padding: 12px 20px;
            border-radius: 12px;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.2);
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s, transform .2s cubic-bezier(.2,.8,.2,1);
            z-index: 99;
        }
        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        /* ------------------------------------------------------------------
           Mobile Responsiveness
        ------------------------------------------------------------------ */
        @media (max-width: 767px) {
            .container {
                padding: 0 18px;
            }
            .hero {
                padding-top: 40px;
                padding-bottom: 30px;
            }
            .metrics-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .tech-grid {
                grid-template-columns: 1fr;
            }
            .card-panel, .project-card {
                padding: 20px 18px;
            }
            .award-item {
                padding: 18px 18px;
            }
            .hero-actions .btn {
                flex: 1;
                height: 48px;
            }
        }

        @media (max-width: 480px) {
            .award-item {
                flex-direction: column;
                gap: 8px;
            }
            .award-date {
                font-size: 0.78rem;
            }
        }
    </style>
</head>
<body>
    <!-- Top Navigation -->
    <nav class="topbar">
        <div class="inner">
            <div class="topbar-brand">
                <span id="navName">iamywl</span>
                <span class="topbar-brand-badge">SRE · Infra</span>
            </div>
            <div class="topbar-actions">
                <button class="icon-btn" id="themeToggle" title="테마 전환"><i class="fas fa-moon"></i></button>
                <button class="icon-btn" id="navCopy" title="이메일 복사"><i class="fas fa-envelope"></i></button>
                <a class="icon-btn" id="navGithub" target="_blank" rel="noopener" title="GitHub"><i class="fab fa-github"></i></a>
            </div>
        </div>
    </nav>

    <div class="container" id="app"></div>
    <div class="toast" id="toast"></div>

    <script src="js/data.js?v=13"></script>
    <script>
        // 테마 관리 (다크모드 / 화이트모드)
        const initTheme = () => {
            const saved = localStorage.getItem('theme');
            if (saved) {
                document.documentElement.setAttribute('data-theme', saved);
            }
            updateThemeIcon();
        };

        const updateThemeIcon = () => {
            const current = document.documentElement.getAttribute('data-theme');
            const isDark = current === 'dark' || (!current && window.matchMedia('(prefers-color-scheme: dark)').matches);
            const icon = document.querySelector('#themeToggle i');
            if (icon) {
                icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
            }
        };

        document.getElementById('themeToggle')?.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            const isDark = current === 'dark' || (!current && window.matchMedia('(prefers-color-scheme: dark)').matches);
            const next = isDark ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            updateThemeIcon();
        });

        initTheme();

        document.addEventListener('DOMContentLoaded', () => {
            const app = document.getElementById('app');
            if (typeof resumeData === 'undefined') {
                app.innerHTML = '<p style="text-align:center;padding:80px 0;color:#71717A">데이터를 불러올 수 없습니다. (js/data.js 확인 필요)</p>';
                return;
            }
            const d = resumeData;
            const esc = (s) => String(s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
            const paragraphs = (d.profile.fullIntro || '')
                .split('\n').map(l => l.trim()).filter(Boolean);

            document.getElementById('navName').textContent = '@' + d.profile.github;
            document.getElementById('navGithub').href = 'https://github.com/' + d.profile.github;

            app.innerHTML = `
                <!-- 1. Hero -->
                <header class="hero">
                    <span class="hero-tag">Infrastructure &amp; Security Engineering</span>
                    <h1 class="hero-title">${esc(d.profile.name)}</h1>
                    <p class="hero-role">${esc(d.profile.title)}</p>
                    <p class="hero-desc">${esc(d.profile.summary)}</p>
                    <div class="hero-actions">
                        <a class="btn btn-primary" href="https://github.com/${esc(d.profile.github)}" target="_blank" rel="noopener">
                            <i class="fab fa-github"></i> GitHub 프로필
                        </a>
                        <button class="btn btn-secondary" id="copyEmail" data-email="${esc(d.profile.email)}">
                            <i class="fas fa-envelope"></i> 이메일 복사
                        </button>
                    </div>
                </header>

                <!-- 2. Key Metrics -->
                ${Array.isArray(d.stats) && d.stats.length ? `
                <section>
                    <div class="metrics-grid">
                        ${d.stats.map(s => `
                            <div class="metric-card">
                                <div class="metric-value">${esc(s.value)}</div>
                                <div class="metric-label">${esc(s.label)}</div>
                            </div>
                        `).join('')}
                    </div>
                </section>` : ''}

                <!-- 3. Engineering Philosophy -->
                <section>
                    <div class="section-header">
                        <h2 class="section-title">엔지니어링 철학</h2>
                    </div>
                    <div class="card-panel">
                        <h3 class="about-quote">"문제를 정의하고 시스템 레벨에서 측정 가능하게 해결합니다."</h3>
                        <div class="about-text">
                            ${paragraphs.map(p => `<p>${esc(p)}</p>`).join('')}
                        </div>
                    </div>
                </section>

                <!-- 4. Flagship Projects -->
                <section>
                    <div class="section-header">
                        <h2 class="section-title">핵심 프로젝트</h2>
                        <span class="section-count">${d.projects.length}개 프로젝트</span>
                    </div>
                    <div class="project-list">
                        ${d.projects.map(pj => `
                            <article class="project-card">
                                <div class="project-meta-row">
                                    <span class="badge-pill">${esc(pj.badge || 'Engineering')}</span>
                                    <span class="project-date">${esc(pj.period)}</span>
                                </div>
                                <h3 class="project-title">${esc(pj.title)}</h3>
                                <p class="project-summary">${esc(pj.description)}</p>
                                <ul class="project-bullets">
                                    ${pj.points.map(pt => `<li>${esc(pt)}</li>`).join('')}
                                </ul>
                                ${pj.link && pj.link !== '#' ? `
                                    <a class="project-link" href="${esc(pj.link)}" target="_blank" rel="noopener">
                                        GitHub Repository <i class="fas fa-arrow-right"></i>
                                    </a>
                                ` : ''}
                            </article>
                        `).join('')}
                    </div>
                </section>

                <!-- 5. Honors & Research (Dossier Format) -->
                <section>
                    <div class="section-header">
                        <h2 class="section-title">공식 수상 및 연구 성과</h2>
                        <span class="section-count">총 ${d.awards.length}건</span>
                    </div>
                    <div class="awards-container">
                        ${d.awards.map((aw, idx) => {
                            const isFeatured = aw.featured || idx === 0;
                            return `
                                <div class="award-item ${isFeatured ? 'featured' : ''}">
                                    <div class="award-main">
                                        <div class="award-title-row">
                                            <span class="award-title">${esc(aw.title)}</span>
                                            ${aw.badge ? `<span class="award-badge">${esc(aw.badge)}</span>` : ''}
                                        </div>
                                        <div class="award-org">${esc(aw.org)}</div>
                                        ${aw.desc ? `<div class="award-desc">${esc(aw.desc)}</div>` : ''}
                                    </div>
                                    <div class="award-date">${esc(aw.date)}</div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </section>

                <!-- 6. Technical Arsenal -->
                ${Array.isArray(d.techCategories) && d.techCategories.length ? `
                <section>
                    <div class="section-header">
                        <h2 class="section-title">기술 스택 (Architecture Pillars)</h2>
                    </div>
                    <div class="tech-grid">
                        ${d.techCategories.map(cat => `
                            <div class="tech-card">
                                <div class="tech-card-header">
                                    <i class="${esc(cat.icon)} tech-card-icon"></i>
                                    <h3 class="tech-card-title">${esc(cat.category)}</h3>
                                </div>
                                <div class="tech-chips">
                                    ${cat.skills.map(sk => `<span class="tech-chip">${esc(sk)}</span>`).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </section>` : ''}

                <!-- Footer -->
                <footer>
                    <p>Last Deployed · <span id="deploy-timestamp">2026-10-19T13:12:42Z</span></p>
                    <p>© 2026 @${esc(d.profile.github)}. Minimalist Engineering Portfolio.</p>
                </footer>
            `;

            // 토스트 클립보드 복사
            const toast = document.getElementById('toast');
            let toastTimer;
            const showToast = (msg) => {
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
            };
            const copyEmail = async (email) => {
                try {
                    await navigator.clipboard.writeText(email);
                    showToast('이메일 주소를 복사했습니다.');
                } catch {
                    showToast(email);
                }
            };
            document.getElementById('copyEmail')?.addEventListener('click', e => copyEmail(e.currentTarget.dataset.email));
            document.getElementById('navCopy')?.addEventListener('click', () => copyEmail(d.profile.email));
        });
    </script>
</body>
</html>
