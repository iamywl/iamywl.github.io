<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>이용원 · Infrastructure & Security Engineer</title>
    <meta name="description" content="문제를 정의하고 기술로 해결하는 인프라·보안 엔지니어 이용원의 포트폴리오">

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        :root {
            --brand: #2563EB;
            --brand-strong: #1D4FD7;
            --brand-ink: #1B4DD1;
            --brand-tint: #E8F0FE;
            --ink: #0B1220;
            --ink-2: #45526B;
            --ink-3: #8A95A8;
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

        body {
            margin: 0;
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", sans-serif;
            color: var(--ink);
            line-height: 1.8;
            letter-spacing: -0.003em;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            background-color: #EAEFF7;
            background-image:
                radial-gradient(60rem 48rem at 12% -8%, rgba(37,99,235,.20), transparent 55%),
                radial-gradient(52rem 40rem at 98% 2%,  rgba(99,102,241,.18), transparent 52%),
                radial-gradient(48rem 46rem at 50% 108%, rgba(56,189,248,.14), transparent 55%);
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        a { color: inherit; text-decoration: none; }

        .wrap { max-width: 760px; margin: 0 auto; padding: 0 24px; }

        /* ---------- Glass ---------- */
        .glass {
            background: rgba(255,255,255,.58);
            -webkit-backdrop-filter: saturate(180%) blur(24px);
            backdrop-filter: saturate(180%) blur(24px);
            border: 1px solid rgba(255,255,255,.65);
            box-shadow: 0 10px 34px rgba(11,18,32,.10), inset 0 1px 0 rgba(255,255,255,.6);
            border-radius: 20px;
        }

        /* ---------- Sticky header ---------- */
        .topbar {
            position: sticky; top: 0; z-index: 40;
            background: rgba(234,239,247,.7);
            -webkit-backdrop-filter: saturate(180%) blur(18px);
            backdrop-filter: saturate(180%) blur(18px);
            border-bottom: 1px solid rgba(255,255,255,.55);
        }
        .topbar .inner { max-width: 760px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; }
        .topbar .brand-name { font-weight: 800; font-size: 1rem; letter-spacing: -0.02em; }
        .topbar .links { display: flex; gap: 6px; }
        .icon-btn {
            display: inline-flex; align-items: center; justify-content: center;
            width: 40px; height: 40px; border-radius: 12px; color: var(--ink);
            transition: transform .15s cubic-bezier(.2,.8,.2,1), background-color .15s;
            -webkit-tap-highlight-color: transparent; cursor: pointer; border: none; background: transparent;
        }
        .icon-btn:hover { background: rgba(255,255,255,.6); }
        .icon-btn:active { transform: scale(.92); }

        /* ---------- Sections ---------- */
        section { margin-top: 72px; }
        .eyebrow {
            font-size: 0.8125rem; font-weight: 700; letter-spacing: 0.14em;
            text-transform: uppercase; color: var(--brand-ink); margin: 0 0 22px;
        }

        /* ---------- Hero ---------- */
        header.hero { padding-top: 80px; text-align: center; }
        .kicker { font-size: 0.875rem; font-weight: 700; letter-spacing: 0.04em; color: var(--brand-ink); margin: 0 0 16px; }
        .hero h1 {
            font-size: clamp(2.6rem, 6.5vw, 3.75rem); font-weight: 800;
            letter-spacing: -0.03em; line-height: 1.08; margin: 0 0 18px;
        }
        .hero .lead {
            font-size: clamp(1.05rem, 2.6vw, 1.3rem); font-weight: 600; letter-spacing: -0.01em;
            line-height: 1.5; color: var(--ink-2); max-width: 30ch; margin: 0 auto 30px;
        }
        .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            height: 50px; padding: 0 22px; border-radius: 14px; font-size: 0.9375rem; font-weight: 700;
            cursor: pointer; border: 1px solid transparent;
            transition: transform .15s cubic-bezier(.2,.8,.2,1), background-color .15s, border-color .15s;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active { transform: scale(.97); }
        .btn-primary { background: var(--brand); color: #fff; box-shadow: 0 8px 20px rgba(37,99,235,.28); }
        .btn-primary:hover { background: var(--brand-strong); }
        .btn-ghost { background: rgba(255,255,255,.6); color: var(--ink); border-color: rgba(255,255,255,.7); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
        .btn-ghost:hover { background: rgba(255,255,255,.85); }
        .btn:focus-visible { outline: 3px solid rgba(37,99,235,.45); outline-offset: 2px; }

        /* ---------- Impact (big numbers) ---------- */
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        .stat { padding: 22px 16px; text-align: center; }
        .stat .num {
            font-size: clamp(1.9rem, 5vw, 2.6rem); font-weight: 800; letter-spacing: -0.02em;
            line-height: 1; color: var(--brand-ink); display: block; margin-bottom: 8px;
        }
        .stat .lbl { font-size: 0.78rem; font-weight: 600; color: var(--ink-2); line-height: 1.4; }

        /* ---------- About ---------- */
        .about-card { padding: 32px; }
        .about-lead {
            font-size: clamp(1.2rem, 3vw, 1.45rem); font-weight: 700; letter-spacing: -0.01em;
            line-height: 1.5; color: var(--ink); margin: 0 0 22px;
        }
        .about-body p { font-size: 1.0625rem; font-weight: 400; line-height: 1.8; color: var(--ink); margin: 0 0 16px; max-width: 62ch; }
        .about-body p:last-child { margin-bottom: 0; }

        /* ---------- Project cards ---------- */
        .card { padding: 28px; transition: transform .2s cubic-bezier(.2,.8,.2,1); }
        .card + .card { margin-top: 16px; }
        .card:hover { transform: translateY(-2px); }
        .proj-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
        .proj-title { font-size: 1.3rem; font-weight: 700; margin: 0; letter-spacing: -0.01em; line-height: 1.3; }
        .chip {
            flex-shrink: 0; font-size: 0.8125rem; font-weight: 600; color: var(--brand-ink);
            background: var(--brand-tint); padding: 6px 12px; border-radius: 999px; white-space: nowrap;
        }
        .proj-desc { font-size: 1.0625rem; font-weight: 600; color: var(--ink); margin: 16px 0 18px; line-height: 1.55; }
        .points { list-style: none; padding: 0; margin: 0 0 20px; display: grid; gap: 12px; }
        .points li { display: flex; gap: 11px; font-size: 1rem; line-height: 1.6; color: var(--ink-2); }
        .points li i { color: var(--brand); margin-top: 7px; font-size: 0.7rem; flex-shrink: 0; }
        .repo-link { display: inline-flex; align-items: center; gap: 7px; font-size: 0.9375rem; font-weight: 700; color: var(--brand-ink); transition: gap .15s; }
        .repo-link:hover { gap: 11px; }

        /* ---------- Awards ---------- */
        .awards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .award { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 18px 20px; }
        .award .a-title { font-size: 0.9375rem; font-weight: 700; margin: 0; line-height: 1.4; }
        .award .a-org { font-size: 0.8125rem; color: var(--ink-3); margin: 4px 0 0; }
        .award .a-date { font-size: 0.8125rem; color: var(--ink-3); white-space: nowrap; flex-shrink: 0; }

        /* ---------- Tech ---------- */
        .tech { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .tech-item { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 24px 12px; transition: transform .2s cubic-bezier(.2,.8,.2,1); }
        .tech-item:hover { transform: translateY(-2px); }
        .tech-item img, .tech-item svg { height: 42px; width: 42px; object-fit: contain; }
        .tech-item span { font-size: 0.8125rem; font-weight: 600; color: var(--ink-2); text-align: center; }

        /* ---------- Footer ---------- */
        footer { margin-top: 88px; padding: 28px 0 56px; text-align: center; }
        footer p { font-size: 0.8125rem; color: var(--ink-3); margin: 0; }

        /* ---------- Toast ---------- */
        .toast {
            position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px);
            background: rgba(11,18,32,.92); color: #fff; font-size: 0.9375rem; font-weight: 600;
            padding: 13px 20px; border-radius: 14px; box-shadow: 0 12px 32px rgba(11,18,32,.3);
            -webkit-backdrop-filter: saturate(180%) blur(12px); backdrop-filter: saturate(180%) blur(12px);
            opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s cubic-bezier(.2,.8,.2,1); z-index: 50;
        }
        .toast.show { opacity: 1; transform: translate(-50%, 0); }

        /* ---------- Reveal ---------- */
        .reveal { opacity: 0; transform: translateY(16px); transition: opacity .6s ease, transform .6s cubic-bezier(.2,.8,.2,1); }
        .reveal.in { opacity: 1; transform: none; }

        /* ---------- Mobile ---------- */
        @media (max-width: 767px) {
            .wrap { padding: 0 20px; }
            .topbar .inner { padding: 10px 20px; }
            header.hero { padding-top: 48px; }
            section { margin-top: 56px; }
            .stats { grid-template-columns: 1fr 1fr; }
            .awards { grid-template-columns: 1fr; }
            .actions .btn { flex: 1; height: 52px; }
            .about-card, .card { padding: 24px; }
            body { background-attachment: scroll; }
        }

        /* ---------- Fallbacks ---------- */
        @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
            .glass, .topbar, .btn-ghost { background: #fff; }
        }
        @media (prefers-reduced-transparency: reduce) {
            .glass { background: #fff; backdrop-filter: none; -webkit-backdrop-filter: none; }
            .topbar { background: #EAEFF7; backdrop-filter: none; }
            .toast { backdrop-filter: none; background: #0B1220; }
        }
        @media (prefers-reduced-motion: reduce) {
            * { scroll-behavior: auto !important; }
            .reveal { opacity: 1 !important; transform: none !important; transition: none; }
            .btn:active, .card:hover, .tech-item:hover, .icon-btn:active { transform: none; }
        }
    </style>
</head>
<body>
    <nav class="topbar">
        <div class="inner">
            <span class="brand-name" id="navName"></span>
            <div class="links">
                <button class="icon-btn" id="navCopy" title="이메일 복사"><i class="fas fa-envelope"></i></button>
                <a class="icon-btn" id="navGithub" target="_blank" rel="noopener" title="GitHub"><i class="fab fa-github"></i></a>
            </div>
        </div>
    </nav>

    <div class="wrap" id="app"></div>
    <div class="toast" id="toast"></div>

    <script src="js/data.js?v=7"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const app = document.getElementById('app');
            if (typeof resumeData === 'undefined') {
                app.innerHTML = '<p style="text-align:center;padding:80px 0;color:#45526B">데이터를 불러올 수 없어요. (js/data.js 확인 필요)</p>';
                return;
            }
            const d = resumeData;
            const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
            // fullIntro -> 정돈된 문단 (들여쓰기 잔재 제거, 빈 줄로 문단 분리)
            const paragraphs = (d.profile.fullIntro || '')
                .split('\n').map(l => l.trim()).filter(Boolean);

            // 상단바
            document.getElementById('navName').textContent = d.profile.name;
            document.getElementById('navGithub').href = 'https://github.com/' + d.profile.github;

            app.innerHTML = `
                <header class="hero reveal">
                    <p class="kicker">${esc(d.profile.title)}</p>
                    <h1>${esc(d.profile.name)}</h1>
                    <p class="lead">${esc(d.profile.keyword)}</p>
                    <div class="actions">
                        <button class="btn btn-primary" id="copyEmail" data-email="${esc(d.profile.email)}">
                            <i class="fas fa-envelope"></i> 이메일 복사
                        </button>
                        <a class="btn btn-ghost" href="https://github.com/${esc(d.profile.github)}" target="_blank" rel="noopener">
                            <i class="fab fa-github"></i> GitHub
                        </a>
                    </div>
                </header>

                ${Array.isArray(d.stats) && d.stats.length ? `
                <section class="reveal">
                    <div class="stats">
                        ${d.stats.map(s => `
                            <div class="stat glass">
                                <span class="num">${esc(s.value)}</span>
                                <span class="lbl">${esc(s.label)}</span>
                            </div>
                        `).join('')}
                    </div>
                </section>` : ''}

                <section class="reveal">
                    <p class="eyebrow">About</p>
                    <div class="about-card glass">
                        <p class="about-lead">"${esc(d.profile.summary)}"</p>
                        <div class="about-body">
                            ${paragraphs.map(p => `<p>${esc(p)}</p>`).join('')}
                        </div>
                    </div>
                </section>

                <section class="reveal">
                    <p class="eyebrow">Projects</p>
                    ${d.projects.map(pj => `
                        <article class="card glass">
                            <div class="proj-head">
                                <h3 class="proj-title">${esc(pj.title)}</h3>
                                <span class="chip">${esc(pj.period)}</span>
                            </div>
                            <p class="proj-desc">${esc(pj.description)}</p>
                            <ul class="points">
                                ${pj.points.map(pt => `<li><i class="fas fa-check"></i><span>${esc(pt)}</span></li>`).join('')}
                            </ul>
                            ${pj.link && pj.link !== '#' ? `<a class="repo-link" href="${esc(pj.link)}" target="_blank" rel="noopener">GitHub Repository <i class="fas fa-arrow-right"></i></a>` : ''}
                        </article>
                    `).join('')}
                </section>

                <section class="reveal">
                    <p class="eyebrow">Awards</p>
                    <div class="awards">
                        ${d.awards.map(aw => `
                            <div class="award glass">
                                <div>
                                    <p class="a-title">${esc(aw.title)}</p>
                                    <p class="a-org">${esc(aw.org)}</p>
                                </div>
                                <span class="a-date">${esc(aw.date)}</span>
                            </div>
                        `).join('')}
                    </div>
                </section>

                <section class="reveal">
                    <p class="eyebrow">Tech Stack</p>
                    <div class="tech">
                        ${d.techStack.map(t => {
                            const icon = t.svg
                                ? t.svg.replace('<svg', '<svg height="42" width="42"')
                                : `<img src="${esc(t.img)}" alt="${esc(t.name)}" loading="lazy" onerror="this.style.opacity=.25">`;
                            return `<div class="tech-item glass">${icon}<span>${esc(t.name)}</span></div>`;
                        }).join('')}
                    </div>
                </section>

                <footer>
                    <p>Last Deployed · <span id="deploy-timestamp">2026-06-25T05:19:38Z</span></p>
                </footer>
            `;

            // 토스트
            const toast = document.getElementById('toast');
            let toastTimer;
            const showToast = (msg) => {
                toast.textContent = msg; toast.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
            };
            const copyEmail = async (email) => {
                try { await navigator.clipboard.writeText(email); showToast('이메일을 복사했어요 ✓'); }
                catch { showToast(email); }
            };
            document.getElementById('copyEmail')?.addEventListener('click', e => copyEmail(e.currentTarget.dataset.email));
            document.getElementById('navCopy')?.addEventListener('click', () => copyEmail(d.profile.email));

            // 스크롤 리빌
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                const io = new IntersectionObserver((entries) => {
                    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
                }, { threshold: 0.1 });
                document.querySelectorAll('.reveal').forEach(el => io.observe(el));
            } else {
                document.querySelectorAll('.reveal').forEach(el => el.classList.add('in'));
            }
        });
    </script>
</body>
</html>
