<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>iamywl · Infrastructure & Security Architect</title>
    <meta name="description" content="Linux Kernel 6.x & eBPF, Kubernetes Multi-Cluster, Cloud Native & DevSecOps를 연구하는 시스템 아키텍트 iamywl의 포트폴리오">

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        :root {
            /* Toss & Apple Primary Tokens */
            --brand: #3182F6;
            --brand-strong: #1B64DA;
            --brand-ink: #1B64DA;
            --brand-tint: #EFF6FF;
            --brand-border: #DBEAFE;
            
            /* Light Theme: Apple Platinum & Toss Pure White */
            --bg-base: #F8FAFC;
            --bg-gradient: radial-gradient(55rem 45rem at 15% -5%, rgba(49, 130, 246, 0.08), transparent 60%),
                           radial-gradient(50rem 40rem at 85% 10%, rgba(99, 102, 241, 0.05), transparent 55%),
                           radial-gradient(40rem 40rem at 50% 95%, rgba(6, 182, 212, 0.05), transparent 60%);
            
            --glass-bg: rgba(255, 255, 255, 0.88);
            --glass-border: rgba(226, 232, 240, 0.9);
            --glass-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.04), 0 2px 6px -1px rgba(15, 23, 42, 0.02), inset 0 1px 0 rgba(255, 255, 255, 0.95);
            --glass-hover-shadow: 0 14px 32px -4px rgba(49, 130, 246, 0.12), 0 4px 12px -2px rgba(15, 23, 42, 0.04);
            --glass-hover-border: rgba(49, 130, 246, 0.35);

            --ink: #0F172A;
            --ink-2: #334155;
            --ink-3: #64748B;
            --topbar-bg: rgba(248, 250, 252, 0.82);
            --chip-bg: #EFF6FF;
            --chip-text: #2563EB;
            
            --featured-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.96) 0%, rgba(254, 249, 235, 0.9) 100%);
            --featured-border: #FDE68A;
            --featured-shadow: 0 10px 28px -4px rgba(245, 158, 11, 0.14), 0 2px 8px -1px rgba(15, 23, 42, 0.03);

            --code-pill-bg: #F1F5F9;
            --code-pill-border: #E2E8F0;
            --code-pill-text: #334155;
        }

        [data-theme="dark"] {
            --brand: #38BDF8;
            --brand-strong: #0284C7;
            --brand-ink: #58A6FF;
            --brand-tint: rgba(37, 99, 235, 0.15);
            --brand-border: rgba(56, 189, 248, 0.25);
            
            /* Dark Theme: VisionOS Obsidian */
            --bg-base: #0B0F19;
            --bg-gradient: radial-gradient(55rem 45rem at 15% -5%, rgba(49, 130, 246, 0.15), transparent 60%),
                           radial-gradient(50rem 40rem at 85% 10%, rgba(99, 102, 241, 0.10), transparent 55%),
                           radial-gradient(40rem 40rem at 50% 95%, rgba(6, 182, 212, 0.08), transparent 60%);
            
            --glass-bg: rgba(22, 27, 34, 0.78);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 8px 24px -2px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            --glass-hover-shadow: 0 16px 36px -4px rgba(49, 130, 246, 0.25), 0 4px 12px -2px rgba(0, 0, 0, 0.4);
            --glass-hover-border: rgba(56, 189, 248, 0.4);

            --ink: #F0F6FC;
            --ink-2: #C9D1D9;
            --ink-3: #8B949E;
            --topbar-bg: rgba(11, 15, 25, 0.85);
            --chip-bg: rgba(37, 99, 235, 0.2);
            --chip-text: #58A6FF;
            
            --featured-bg: linear-gradient(135deg, rgba(27, 38, 59, 0.88) 0%, rgba(44, 33, 14, 0.75) 100%);
            --featured-border: #78350F;
            --featured-shadow: 0 10px 28px -4px rgba(245, 158, 11, 0.18), 0 2px 8px -1px rgba(0, 0, 0, 0.4);

            --code-pill-bg: rgba(255, 255, 255, 0.05);
            --code-pill-border: rgba(255, 255, 255, 0.1);
            --code-pill-text: #C9D1D9;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --brand: #38BDF8;
                --brand-strong: #0284C7;
                --brand-ink: #58A6FF;
                --brand-tint: rgba(37, 99, 235, 0.15);
                --brand-border: rgba(56, 189, 248, 0.25);
                
                --bg-base: #0B0F19;
                --bg-gradient: radial-gradient(55rem 45rem at 15% -5%, rgba(49, 130, 246, 0.15), transparent 60%),
                               radial-gradient(50rem 40rem at 85% 10%, rgba(99, 102, 241, 0.10), transparent 55%),
                               radial-gradient(40rem 40rem at 50% 95%, rgba(6, 182, 212, 0.08), transparent 60%);
                
                --glass-bg: rgba(22, 27, 34, 0.78);
                --glass-border: rgba(255, 255, 255, 0.08);
                --glass-shadow: 0 8px 24px -2px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.06);
                --glass-hover-shadow: 0 16px 36px -4px rgba(49, 130, 246, 0.25), 0 4px 12px -2px rgba(0, 0, 0, 0.4);
                --glass-hover-border: rgba(56, 189, 248, 0.4);

                --ink: #F0F6FC;
                --ink-2: #C9D1D9;
                --ink-3: #8B949E;
                --topbar-bg: rgba(11, 15, 25, 0.85);
                --chip-bg: rgba(37, 99, 235, 0.2);
                --chip-text: #58A6FF;
                
                --featured-bg: linear-gradient(135deg, rgba(27, 38, 59, 0.88) 0%, rgba(44, 33, 14, 0.75) 100%);
                --featured-border: #78350F;
                --featured-shadow: 0 10px 28px -4px rgba(245, 158, 11, 0.18), 0 2px 8px -1px rgba(0, 0, 0, 0.4);

                --code-pill-bg: rgba(255, 255, 255, 0.05);
                --code-pill-border: rgba(255, 255, 255, 0.1);
                --code-pill-text: #C9D1D9;
            }
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

        body {
            margin: 0;
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", sans-serif;
            color: var(--ink);
            line-height: 1.8;
            letter-spacing: -0.01em;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            background-color: var(--bg-base);
            background-image: var(--bg-gradient);
            background-repeat: no-repeat;
            background-attachment: fixed;
            transition: background-color .3s ease, color .3s ease;
        }

        a { color: inherit; text-decoration: none; }

        .wrap { max-width: 780px; margin: 0 auto; padding: 0 24px; }

        /* ---------- Toss TDS Glass Cards ---------- */
        .glass {
            background: var(--glass-bg);
            -webkit-backdrop-filter: saturate(180%) blur(24px);
            backdrop-filter: saturate(180%) blur(24px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: 20px;
            transition: transform .22s cubic-bezier(.16,1,.3,1), box-shadow .22s, border-color .22s;
        }

        /* ---------- Sticky header ---------- */
        .topbar {
            position: sticky; top: 0; z-index: 40;
            background: var(--topbar-bg);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid var(--glass-border);
            transition: background .3s;
        }
        .topbar .inner { max-width: 780px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; }
        .topbar .brand-group { display: flex; align-items: center; gap: 10px; }
        .topbar .brand-name { font-weight: 800; font-size: 1.05rem; letter-spacing: -0.025em; color: var(--ink); }
        .topbar .status-beacon {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 0.75rem; font-weight: 700; color: #10B981;
            background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.25);
            padding: 2px 8px; border-radius: 999px;
        }
        .topbar .status-dot {
            width: 6px; height: 6px; border-radius: 50%; background: #10B981;
            box-shadow: 0 0 6px rgba(16, 185, 129, 0.8);
            animation: pulseDot 2s infinite ease-in-out;
        }
        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        .topbar .links { display: flex; gap: 6px; align-items: center; }
        .icon-btn {
            display: inline-flex; align-items: center; justify-content: center;
            width: 40px; height: 40px; border-radius: 12px; color: var(--ink);
            transition: transform .15s cubic-bezier(.2,.8,.2,1), background-color .15s, color .15s;
            -webkit-tap-highlight-color: transparent; cursor: pointer; border: 1px solid transparent; background: transparent;
        }
        .icon-btn:hover { background: var(--brand-tint); color: var(--brand); border-color: var(--brand-border); }
        .icon-btn:active { transform: scale(.92); }

        /* ---------- Sections ---------- */
        section { margin-top: 72px; }
        .eyebrow {
            font-size: 0.8125rem; font-weight: 700; letter-spacing: 0.12em;
            text-transform: uppercase; color: var(--brand-ink); margin: 0 0 22px;
            display: inline-flex; align-items: center; gap: 6px;
        }

        /* ---------- Hero ---------- */
        header.hero { padding-top: 80px; text-align: center; }
        .hero-status-pill {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 6px 14px; border-radius: 999px; font-size: 0.78125rem; font-weight: 700;
            letter-spacing: 0.05em; text-transform: uppercase;
            background: rgba(16, 185, 129, 0.12); color: #059669; border: 1px solid rgba(16, 185, 129, 0.3);
            margin-bottom: 20px;
        }
        [data-theme="dark"] .hero-status-pill,
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) .hero-status-pill {
                background: rgba(16, 185, 129, 0.15); color: #34D399; border-color: rgba(52, 211, 153, 0.35);
            }
        }
        .hero h1 {
            font-size: clamp(2.8rem, 7vw, 4.2rem); font-weight: 800;
            letter-spacing: -0.04em; line-height: 1.05; margin: 0 0 16px; color: var(--ink);
        }
        .hero .subtitle {
            font-size: clamp(1.25rem, 3.2vw, 1.6rem); font-weight: 700; letter-spacing: -0.02em;
            color: var(--brand-ink); margin: 0 0 14px;
        }
        .hero .lead {
            font-size: clamp(1rem, 2.5vw, 1.15rem); font-weight: 500; letter-spacing: -0.015em;
            line-height: 1.6; color: var(--ink-2); max-width: 44ch; margin: 0 auto 32px;
        }
        .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            height: 50px; padding: 0 24px; border-radius: 14px; font-size: 0.9375rem; font-weight: 700;
            cursor: pointer; border: 1px solid transparent;
            transition: transform .15s cubic-bezier(.2,.8,.2,1), background-color .15s, border-color .15s, box-shadow .15s;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active { transform: scale(.97); }
        .btn-primary { background: var(--brand); color: #fff; box-shadow: 0 8px 20px rgba(49,130,246,.28); }
        .btn-primary:hover { background: var(--brand-strong); box-shadow: 0 10px 24px rgba(49,130,246,.38); }
        .btn-ghost { background: var(--glass-bg); color: var(--ink); border-color: var(--glass-border); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
        .btn-ghost:hover { border-color: var(--brand-border); background: var(--brand-tint); color: var(--brand); }
        .btn:focus-visible { outline: 3px solid rgba(49,130,246,.45); outline-offset: 2px; }

        /* ---------- Impact (Telemetry numbers) ---------- */
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        .stat { padding: 22px 14px; text-align: center; }
        .stat:hover { transform: translateY(-2px); box-shadow: var(--glass-hover-shadow); }
        .stat .num {
            font-size: clamp(1.75rem, 4.5vw, 2.3rem); font-weight: 800; letter-spacing: -0.025em;
            line-height: 1.1; color: var(--brand); display: block; margin-bottom: 8px;
        }
        .stat .lbl { font-size: 0.75rem; font-weight: 600; color: var(--ink-2); line-height: 1.4; }

        /* ---------- About ---------- */
        .about-card { padding: 34px; }
        .about-lead {
            font-size: clamp(1.15rem, 2.8vw, 1.35rem); font-weight: 700; letter-spacing: -0.015em;
            line-height: 1.55; color: var(--ink); margin: 0 0 20px;
        }
        .about-body p { font-size: 1rem; font-weight: 400; line-height: 1.85; color: var(--ink-2); margin: 0 0 16px; max-width: 66ch; }
        .about-body p:last-child { margin-bottom: 0; }

        /* ---------- Project cards ---------- */
        .card { padding: 28px; }
        .card + .card { margin-top: 16px; }
        .card:hover { transform: translateY(-2px); box-shadow: var(--glass-hover-shadow); border-color: var(--glass-hover-border); }
        .proj-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
        .proj-title-wrap { display: flex; flex-direction: column; gap: 4px; }
        .proj-title { font-size: 1.25rem; font-weight: 800; margin: 0; letter-spacing: -0.02em; line-height: 1.3; color: var(--ink); }
        .proj-tags { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .domain-badge {
            font-size: 0.75rem; font-weight: 700; color: var(--brand-ink);
            background: var(--brand-tint); border: 1px solid var(--brand-border);
            padding: 3px 10px; border-radius: 999px; white-space: nowrap;
        }
        .chip {
            flex-shrink: 0; font-size: 0.78125rem; font-weight: 600; color: var(--ink-3);
            background: var(--code-pill-bg); padding: 4px 10px; border-radius: 999px; white-space: nowrap; border: 1px solid var(--code-pill-border);
        }
        .proj-desc { font-size: 1rem; font-weight: 600; color: var(--ink); margin: 12px 0 16px; line-height: 1.55; }
        .points { list-style: none; padding: 0; margin: 0 0 20px; display: grid; gap: 10px; }
        .points li { display: flex; gap: 11px; font-size: 0.9375rem; line-height: 1.6; color: var(--ink-2); }
        .points li i { color: var(--brand); margin-top: 6px; font-size: 0.7rem; flex-shrink: 0; }
        .repo-link { display: inline-flex; align-items: center; gap: 7px; font-size: 0.9rem; font-weight: 700; color: var(--brand); transition: gap .15s; }
        .repo-link:hover { gap: 11px; color: var(--brand-strong); }

        /* ---------- Awards (Elevated Toss & Apple TDS) ---------- */
        .awards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .award {
            display: flex; justify-content: space-between; align-items: center; gap: 14px;
            padding: 18px 20px; transition: transform .22s cubic-bezier(.16,1,.3,1), box-shadow .22s, border-color .22s;
            position: relative;
        }
        .award:hover {
            transform: translateY(-2px);
            box-shadow: var(--glass-hover-shadow);
            border-color: var(--glass-hover-border);
        }
        .award.featured {
            grid-column: 1 / -1;
            background: var(--featured-bg);
            border-color: var(--featured-border);
            box-shadow: var(--featured-shadow);
            padding: 24px 26px;
        }
        .award-main { display: flex; align-items: center; gap: 14px; min-width: 0; }
        .award-icon-box {
            width: 44px; height: 44px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.25rem; flex-shrink: 0;
            background: rgba(245, 158, 11, 0.10); border: 1px solid rgba(245, 158, 11, 0.25);
        }
        .award.featured .award-icon-box {
            width: 52px; height: 52px; font-size: 1.6rem;
            background: linear-gradient(135deg, #FEF3C7, #FDE68A);
            border: 1px solid #F59E0B;
            box-shadow: 0 4px 14px rgba(245, 158, 11, 0.25);
        }
        .award-info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
        .award .a-title {
            font-size: 0.9375rem; font-weight: 700; margin: 0; line-height: 1.35;
            color: var(--ink); letter-spacing: -0.015em;
        }
        .award.featured .a-title {
            font-size: 1.15rem; font-weight: 800; letter-spacing: -0.02em;
        }
        .award .a-desc {
            font-size: 0.84rem; font-weight: 500; color: var(--ink-2); margin: 2px 0 0; line-height: 1.4;
        }
        .award .a-org {
            font-size: 0.8125rem; font-weight: 500; color: var(--ink-3); margin: 0;
            display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .award .a-date {
            font-size: 0.78125rem; font-weight: 700; color: var(--brand-ink);
            background: var(--brand-tint); border: 1px solid var(--brand-border);
            padding: 4px 10px; border-radius: 999px; white-space: nowrap; flex-shrink: 0;
        }
        .award-badge-pill {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 2px 8px; border-radius: 999px; font-size: 0.7rem; font-weight: 700;
            background: #FEF3C7; color: #B45309; border: 1px solid #FDE68A;
            margin-left: 8px; vertical-align: middle;
        }

        /* ---------- Technical Arsenal (Bento Architecture) ---------- */
        .bento-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .bento-card { padding: 24px; display: flex; flex-direction: column; gap: 14px; }
        .bento-card:hover { transform: translateY(-2px); box-shadow: var(--glass-hover-shadow); }
        .bento-header { display: flex; align-items: center; gap: 10px; }
        .bento-icon {
            width: 36px; height: 36px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            background: var(--brand-tint); color: var(--brand); border: 1px solid var(--brand-border);
            font-size: 1rem;
        }
        .bento-title { font-size: 1rem; font-weight: 700; color: var(--ink); margin: 0; letter-spacing: -0.015em; }
        .bento-pills { display: flex; flex-wrap: wrap; gap: 8px; }
        .tech-pill {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 0.8125rem; font-weight: 600; color: var(--code-pill-text);
            background: var(--code-pill-bg); border: 1px solid var(--code-pill-border);
            padding: 4px 10px; border-radius: 8px;
        }

        /* ---------- Footer ---------- */
        footer { margin-top: 88px; padding: 28px 0 56px; text-align: center; }
        footer p { font-size: 0.8125rem; color: var(--ink-3); margin: 0 0 6px; }

        /* ---------- Toast ---------- */
        .toast {
            position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px);
            background: rgba(15, 23, 42, 0.94); color: #fff; font-size: 0.9375rem; font-weight: 600;
            padding: 13px 20px; border-radius: 14px; box-shadow: 0 12px 32px rgba(11,18,32,.3);
            -webkit-backdrop-filter: saturate(180%) blur(12px); backdrop-filter: saturate(180%) blur(12px);
            opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s cubic-bezier(.2,.8,.2,1); z-index: 50;
        }
        .toast.show { opacity: 1; transform: translate(-50%, 0); }

        /* ---------- Reveal ---------- */
        .reveal { opacity: 0; transform: translateY(16px); transition: opacity .6s ease, transform .6s cubic-bezier(.2,.8,.2,1); }
        .reveal.in { opacity: 1; transform: none; }

        /* ---------- Mobile ---------- */
        @media (max-width: 767px) {
            .wrap { padding: 0 20px; }
            .topbar .inner { padding: 10px 20px; }
            header.hero { padding-top: 48px; }
            section { margin-top: 56px; }
            .stats { grid-template-columns: 1fr 1fr; }
            .bento-grid { grid-template-columns: 1fr; }
            .awards { grid-template-columns: 1fr; }
            .award.featured { grid-column: auto; }
            .actions .btn { flex: 1; height: 52px; }
            .about-card, .card { padding: 24px; }
            body { background-attachment: scroll; }
        }

        /* ---------- Fallbacks ---------- */
        @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
            .glass, .topbar, .btn-ghost { background: #fff; }
        }
        @media (prefers-reduced-transparency: reduce) {
            .glass { background: #fff; backdrop-filter: none; -webkit-backdrop-filter: none; }
            .topbar { background: var(--bg-base); backdrop-filter: none; }
            .toast { backdrop-filter: none; background: #0B1220; }
        }
        @media (prefers-reduced-motion: reduce) {
            * { scroll-behavior: auto !important; }
            .reveal { opacity: 1 !important; transform: none !important; transition: none; }
            .btn:active, .card:hover, .bento-card:hover, .icon-btn:active, .award:hover, .stat:hover { transform: none; }
        }
    </style>
</head>
<body>
    <nav class="topbar">
        <div class="inner">
            <div class="brand-group">
                <span class="brand-name" id="navName">iamywl</span>
                <span class="status-beacon"><span class="status-dot"></span> Operational</span>
            </div>
            <div class="links">
                <button class="icon-btn" id="themeToggle" title="테마 변경"><i class="fas fa-moon"></i></button>
                <button class="icon-btn" id="navCopy" title="이메일 복사"><i class="fas fa-envelope"></i></button>
                <a class="icon-btn" id="navGithub" target="_blank" rel="noopener" title="GitHub"><i class="fab fa-github"></i></a>
            </div>
        </div>
    </nav>

    <div class="wrap" id="app"></div>
    <div class="toast" id="toast"></div>

    <script src="js/data.js?v=9"></script>
    <script>
        // 테마 관리 (Light / Dark)
        const initTheme = () => {
            const saved = localStorage.getItem('theme');
            if (saved) {
                document.documentElement.setAttribute('data-theme', saved);
            }
            updateThemeIcon();
        };

        const updateThemeIcon = () => {
            const current = document.documentElement.getAttribute('data-theme');
            const isDark = current === 'dark' || (!current && window.matchMedia('(prefers-color-scheme: dark)').matches);
            const icon = document.querySelector('#themeToggle i');
            if (icon) {
                icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
            }
        };

        document.getElementById('themeToggle')?.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            const isDark = current === 'dark' || (!current && window.matchMedia('(prefers-color-scheme: dark)').matches);
            const next = isDark ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            updateThemeIcon();
        });

        initTheme();

        document.addEventListener('DOMContentLoaded', () => {
            const app = document.getElementById('app');
            if (typeof resumeData === 'undefined') {
                app.innerHTML = '<p style="text-align:center;padding:80px 0;color:#45526B">데이터를 불러올 수 없어요. (js/data.js 확인 필요)</p>';
                return;
            }
            const d = resumeData;
            const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
            const paragraphs = (d.profile.fullIntro || '')
                .split('\n').map(l => l.trim()).filter(Boolean);

            // 상단바
            document.getElementById('navName').textContent = '@' + d.profile.github;
            document.getElementById('navGithub').href = 'https://github.com/' + d.profile.github;

            app.innerHTML = `
                <header class="hero reveal">
                    <div>
                        <span class="hero-status-pill">
                            <i class="fas fa-circle-dot" style="font-size: 0.65rem;"></i> ${esc(d.profile.status || 'System Operational · Ready to Deploy')}
                        </span>
                    </div>
                    <h1>${esc(d.profile.name)}</h1>
                    <p class="subtitle">${esc(d.profile.title)}</p>
                    <p class="lead">${esc(d.profile.keyword)}</p>
                    <div class="actions">
                        <button class="btn btn-primary" id="copyEmail" data-email="${esc(d.profile.email)}">
                            <i class="fas fa-envelope"></i> 이메일 복사
                        </button>
                        <a class="btn btn-ghost" href="https://github.com/${esc(d.profile.github)}" target="_blank" rel="noopener">
                            <i class="fab fa-github"></i> GitHub 프로필
                        </a>
                    </div>
                </header>

                ${Array.isArray(d.stats) && d.stats.length ? `
                <section class="reveal">
                    <div class="stats">
                        ${d.stats.map(s => `
                            <div class="stat glass">
                                <span class="num">${esc(s.value)}</span>
                                <span class="lbl">${esc(s.label)}</span>
                            </div>
                        `).join('')}
                    </div>
                </section>` : ''}

                <section class="reveal">
                    <p class="eyebrow"><i class="fas fa-terminal"></i> About &amp; Engineering Philosophy</p>
                    <div class="about-card glass">
                        <p class="about-lead">"${esc(d.profile.summary)}"</p>
                        <div class="about-body">
                            ${paragraphs.map(p => `<p>${esc(p)}</p>`).join('')}
                        </div>
                    </div>
                </section>

                <section class="reveal">
                    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 22px;">
                        <p class="eyebrow" style="margin: 0;"><i class="fas fa-code-branch"></i> Flagship Production &amp; Research Showcases</p>
                        <span style="font-size: 0.8125rem; font-weight: 600; color: var(--ink-3);">핵심 프로젝트 ${d.projects.length}건</span>
                    </div>
                    ${d.projects.map(pj => `
                        <article class="card glass">
                            <div class="proj-head">
                                <div class="proj-title-wrap">
                                    <h3 class="proj-title">${esc(pj.title)}</h3>
                                    <div class="proj-tags">
                                        ${pj.badge ? `<span class="domain-badge">${esc(pj.badge)}</span>` : ''}
                                    </div>
                                </div>
                                <span class="chip">${esc(pj.period)}</span>
                            </div>
                            <p class="proj-desc">${esc(pj.description)}</p>
                            <ul class="points">
                                ${pj.points.map(pt => `<li><i class="fas fa-check"></i><span>${esc(pt)}</span></li>`).join('')}
                            </ul>
                            ${pj.link && pj.link !== '#' ? `<a class="repo-link" href="${esc(pj.link)}" target="_blank" rel="noopener">GitHub Repository <i class="fas fa-arrow-right"></i></a>` : ''}
                        </article>
                    `).join('')}
                </section>

                <section class="reveal">
                    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 22px;">
                        <p class="eyebrow" style="margin: 0;"><i class="fas fa-trophy" style="color: #F59E0B;"></i> Honors &amp; Engineering Awards</p>
                        <span style="font-size: 0.8125rem; font-weight: 600; color: var(--ink-3);">공식 수상 ${d.awards.length}건</span>
                    </div>
                    <div class="awards">
                        ${d.awards.map((aw, idx) => {
                            const isFeatured = aw.featured || idx === 0;
                            return `
                            <div class="award glass ${isFeatured ? 'featured' : ''}">
                                <div class="award-main">
                                    <div class="award-icon-box">
                                        ${isFeatured ? '🏆' : (idx < 3 ? '🥇' : '🎖️')}
                                    </div>
                                    <div class="award-info">
                                        <p class="a-title">
                                            ${esc(aw.title)}
                                            ${aw.badge ? `<span class="award-badge-pill">${esc(aw.badge)}</span>` : ''}
                                        </p>
                                        ${aw.desc ? `<p class="a-desc">${esc(aw.desc)}</p>` : ''}
                                        <p class="a-org"><i class="fas fa-building" style="font-size: 0.7rem; opacity: 0.7;"></i> ${esc(aw.org)}</p>
                                    </div>
                                </div>
                                <span class="a-date">${esc(aw.date)}</span>
                            </div>
                            `;
                        }).join('')}
                    </div>
                </section>

                ${Array.isArray(d.techCategories) && d.techCategories.length ? `
                <section class="reveal">
                    <p class="eyebrow"><i class="fas fa-cubes-stacked"></i> Technical Arsenal (Bento Architecture)</p>
                    <div class="bento-grid">
                        ${d.techCategories.map(cat => `
                            <div class="bento-card glass">
                                <div class="bento-header">
                                    <div class="bento-icon"><i class="${esc(cat.icon)}"></i></div>
                                    <h4 class="bento-title">${esc(cat.category)}</h4>
                                </div>
                                <div class="bento-pills">
                                    ${cat.skills.map(sk => `<span class="tech-pill">${esc(sk)}</span>`).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </section>` : ''}

                <footer>
                    <p>Last Deployed · <span id="deploy-timestamp">2026-10-19T12:40:30Z</span></p>
                    <p>© 2026 @${esc(d.profile.github)}. Toss TDS &amp; Apple Platinum Liquid Glass Design System.</p>
                </footer>
            `;

            // 토스트
            const toast = document.getElementById('toast');
            let toastTimer;
            const showToast = (msg) => {
                toast.textContent = msg; toast.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
            };
            const copyEmail = async (email) => {
                try { await navigator.clipboard.writeText(email); showToast('이메일을 복사했어요 ✓'); }
                catch { showToast(email); }
            };
            document.getElementById('copyEmail')?.addEventListener('click', e => copyEmail(e.currentTarget.dataset.email));
            document.getElementById('navCopy')?.addEventListener('click', () => copyEmail(d.profile.email));

            // 스크롤 리빌
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                const io = new IntersectionObserver((entries) => {
                    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
                }, { threshold: 0.08 });
                document.querySelectorAll('.reveal').forEach(el => io.observe(el));
            } else {
                document.querySelectorAll('.reveal').forEach(el => el.classList.add('in'));
            }
        });
    </script>
</body>
</html>
