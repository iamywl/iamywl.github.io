<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>iamywl · Infrastructure &amp; Security Architect</title>
    <meta name="description" content="Linux Kernel 6.x & eBPF, Kubernetes Multi-Cluster, Cloud Native & DevSecOps 시스템 아키텍트 iamywl의 엔지니어링 포트폴리오">

    <!-- Pretendard & JetBrains Mono Fonts -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        /* ------------------------------------------------------------------
           Linear & Vercel Bento Design Tokens
        ------------------------------------------------------------------ */
        :root {
            /* Accent: Cyber Emerald & Electric Violet */
            --accent-emerald: #10B981;
            --accent-emerald-tint: rgba(16, 185, 129, 0.12);
            --accent-emerald-border: rgba(16, 185, 129, 0.3);
            --accent-violet: #8B5CF6;
            --accent-violet-tint: rgba(139, 92, 246, 0.12);
            --accent-cyan: #06B6D4;
            --accent-cyan-tint: rgba(6, 182, 212, 0.12);
            --accent-amber: #F59E0B;
            --accent-amber-tint: rgba(245, 158, 11, 0.12);

            /* Dark Mode Default (Linear / Vercel Deep Space) */
            --bg-page: #0B0F17;
            --bg-page-mesh: radial-gradient(circle 800px at 15% -10%, rgba(16, 185, 129, 0.08), transparent 70%),
                            radial-gradient(circle 700px at 85% 20%, rgba(139, 92, 246, 0.06), transparent 70%),
                            radial-gradient(circle 600px at 50% 90%, rgba(6, 182, 212, 0.05), transparent 70%);

            --bg-surface: rgba(17, 24, 39, 0.75);
            --bg-surface-elevated: rgba(30, 41, 59, 0.65);
            --bg-terminal: #070A0F;
            --border-surface: rgba(255, 255, 255, 0.08);
            --border-surface-hover: rgba(16, 185, 129, 0.4);

            --text-primary: #F8FAFC;
            --text-secondary: #CBD5E1;
            --text-tertiary: #94A3B8;
            --text-muted: #64748B;

            --btn-primary-bg: #10B981;
            --btn-primary-text: #042F2E;
            --btn-primary-hover: #059669;

            --btn-secondary-bg: rgba(255, 255, 255, 0.05);
            --btn-secondary-text: #F8FAFC;
            --btn-secondary-border: rgba(255, 255, 255, 0.12);
            --btn-secondary-hover: rgba(255, 255, 255, 0.1);

            --card-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.5), 0 2px 6px -1px rgba(0, 0, 0, 0.4);
            --card-shadow-hover: 0 16px 36px -4px rgba(0, 0, 0, 0.7), 0 0 20px rgba(16, 185, 129, 0.15);

            --topbar-bg: rgba(11, 15, 23, 0.85);
            --topbar-border: rgba(255, 255, 255, 0.08);

            --chip-bg: rgba(255, 255, 255, 0.06);
            --chip-border: rgba(255, 255, 255, 0.1);
            --chip-text: #CBD5E1;
        }

        [data-theme="light"] {
            /* Light Mode (Crisp Minimalist Studio) */
            --bg-page: #FAFAFA;
            --bg-page-mesh: radial-gradient(circle 800px at 15% -10%, rgba(16, 185, 129, 0.05), transparent 70%),
                            radial-gradient(circle 700px at 85% 20%, rgba(139, 92, 246, 0.04), transparent 70%);

            --bg-surface: #FFFFFF;
            --bg-surface-elevated: #F8FAFC;
            --bg-terminal: #0F172A;
            --border-surface: #E2E8F0;
            --border-surface-hover: rgba(16, 185, 129, 0.5);

            --text-primary: #0F172A;
            --text-secondary: #334155;
            --text-tertiary: #64748B;
            --text-muted: #94A3B8;

            --btn-primary-bg: #0F172A;
            --btn-primary-text: #FFFFFF;
            --btn-primary-hover: #1E293B;

            --btn-secondary-bg: #FFFFFF;
            --btn-secondary-text: #0F172A;
            --btn-secondary-border: #E2E8F0;
            --btn-secondary-hover: #F1F5F9;

            --card-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05), 0 1px 3px rgba(15, 23, 42, 0.03);
            --card-shadow-hover: 0 14px 32px -4px rgba(15, 23, 42, 0.12), 0 0 16px rgba(16, 185, 129, 0.12);

            --topbar-bg: rgba(250, 250, 250, 0.88);
            --topbar-border: #E2E8F0;

            --chip-bg: #F1F5F9;
            --chip-border: #E2E8F0;
            --chip-text: #334155;
        }

        /* ------------------------------------------------------------------
           Base Typography & Reset
        ------------------------------------------------------------------ */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background-color: var(--bg-page);
            background-image: var(--bg-page-mesh);
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--text-primary);
            line-height: 1.65;
            letter-spacing: -0.02em;
            word-break: keep-all;
            overflow-wrap: break-word;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            transition: background-color .25s ease, color .25s ease;
            overflow-x: hidden;
        }

        a { color: inherit; text-decoration: none; }
        .mono { font-family: 'JetBrains Mono', monospace; }

        .container {
            max-width: 820px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ------------------------------------------------------------------
           Bento Card Primitive (Squircle & Frosted Glass)
        ------------------------------------------------------------------ */
        .bento-card {
            background: var(--bg-surface);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-surface);
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            transition: transform .22s cubic-bezier(.16,1,.3,1), box-shadow .22s, border-color .22s;
        }
        .bento-card:hover {
            border-color: var(--border-surface-hover);
            box-shadow: var(--card-shadow-hover);
            transform: translateY(-2px);
        }

        /* ------------------------------------------------------------------
           Sticky Minimal Navigation
        ------------------------------------------------------------------ */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 50;
            background: var(--topbar-bg);
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--topbar-border);
            transition: background .25s, border-color .25s;
        }
        .topbar .inner {
            max-width: 820px;
            margin: 0 auto;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .brand-link {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand-avatar {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: linear-gradient(135deg, #10B981, #06B6D4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: #042F2E;
            font-weight: 800;
        }
        .brand-handle {
            font-weight: 800;
            font-size: 1.05rem;
            letter-spacing: -0.03em;
            color: var(--text-primary);
        }
        .nav-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            color: var(--text-secondary);
            border: 1px solid transparent;
            background: transparent;
            cursor: pointer;
            transition: background .15s, color .15s;
            -webkit-tap-highlight-color: transparent;
        }
        .icon-btn:hover {
            background: var(--chip-bg);
            color: var(--text-primary);
            border-color: var(--chip-border);
        }

        /* ------------------------------------------------------------------
           Hero Section (Linear Identity Statement)
        ------------------------------------------------------------------ */
        .hero {
            padding-top: 64px;
            padding-bottom: 48px;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 5px 12px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
            background: var(--accent-emerald-tint);
            color: var(--accent-emerald);
            border: 1px solid var(--accent-emerald-border);
            margin-bottom: 20px;
            letter-spacing: 0.02em;
        }
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-emerald);
            box-shadow: 0 0 8px var(--accent-emerald);
            animation: pulseDot 2s infinite ease-in-out;
        }
        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }
        .hero-title {
            font-size: clamp(2.4rem, 6vw, 3.6rem);
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 1.1;
            color: var(--text-primary);
            margin-bottom: 16px;
        }
        .hero-statement {
            font-size: clamp(1.15rem, 2.6vw, 1.4rem);
            font-weight: 600;
            letter-spacing: -0.02em;
            line-height: 1.45;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }
        .hero-statement .gradient-text {
            background: linear-gradient(135deg, #10B981, #06B6D4);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero-bio {
            font-size: 1rem;
            font-weight: 400;
            line-height: 1.75;
            color: var(--text-tertiary);
            max-width: 62ch;
            margin-bottom: 32px;
        }
        .hero-ctas {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 48px;
            padding: 0 22px;
            border-radius: 12px;
            font-size: 0.9375rem;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid transparent;
            transition: transform .15s cubic-bezier(.2,.8,.2,1), background-color .15s, border-color .15s, box-shadow .15s;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary {
            background-color: var(--btn-primary-bg);
            color: var(--btn-primary-text);
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.25);
        }
        .btn-primary:hover {
            background-color: var(--btn-primary-hover);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.35);
        }
        .btn-secondary {
            background-color: var(--btn-secondary-bg);
            color: var(--btn-secondary-text);
            border: 1px solid var(--btn-secondary-border);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
        }
        .btn-secondary:hover {
            background-color: var(--btn-secondary-hover);
        }

        /* ------------------------------------------------------------------
           Metrics Bento Grid (4 Hard-Hitting Telemetry Cards)
        ------------------------------------------------------------------ */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 10px;
        }
        .metric-card {
            padding: 22px 16px;
            text-align: center;
        }
        .metric-val {
            font-size: clamp(1.75rem, 4vw, 2.3rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.1;
            color: var(--accent-emerald);
            margin-bottom: 6px;
        }
        .metric-lbl {
            font-size: 0.78125rem;
            font-weight: 600;
            color: var(--text-tertiary);
            line-height: 1.35;
        }

        /* ------------------------------------------------------------------
           Section Common Header
        ------------------------------------------------------------------ */
        section {
            margin-top: 72px;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 22px;
        }
        .section-eyebrow {
            font-size: 0.8125rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--accent-emerald);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
        }
        .section-title {
            font-size: 1.45rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--text-primary);
        }
        .section-counter {
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        /* ------------------------------------------------------------------
           Tech Stacks Bento Grid (Role-Based Architecture)
        ------------------------------------------------------------------ */
        .tech-bento-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        .tech-bento-card {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .tech-bento-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .tech-bento-title-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .tech-bento-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            background: var(--accent-emerald-tint);
            color: var(--accent-emerald);
            border: 1px solid var(--accent-emerald-border);
            flex-shrink: 0;
        }
        .tech-bento-card:nth-child(2) .tech-bento-icon {
            background: var(--accent-cyan-tint);
            color: var(--accent-cyan);
            border-color: rgba(6, 182, 212, 0.3);
        }
        .tech-bento-card:nth-child(3) .tech-bento-icon {
            background: var(--accent-violet-tint);
            color: var(--accent-violet);
            border-color: rgba(139, 92, 246, 0.3);
        }
        .tech-bento-card:nth-child(4) .tech-bento-icon {
            background: var(--accent-amber-tint);
            color: var(--accent-amber);
            border-color: rgba(245, 158, 11, 0.3);
        }
        .tech-bento-title {
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }
        .tech-bento-desc {
            font-size: 0.8125rem;
            font-weight: 500;
            color: var(--text-tertiary);
            line-height: 1.45;
        }
        .tech-items-flow {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .tech-stack-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 10px;
            background: var(--bg-surface-elevated);
            border: 1px solid var(--border-surface);
            transition: background .15s, border-color .15s;
        }
        .tech-stack-row:hover {
            border-color: var(--border-surface-hover);
        }
        .tech-stack-name {
            font-size: 0.875rem;
            font-weight: 700;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
        }
        .tech-stack-context {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-tertiary);
            text-align: right;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ------------------------------------------------------------------
           Featured Projects (Case Study Format + Terminal Mockup)
        ------------------------------------------------------------------ */
        .project-feed {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .case-study-card {
            padding: 30px;
            overflow: hidden;
        }
        .case-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .case-domain-badge {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-emerald);
            background: var(--accent-emerald-tint);
            border: 1px solid var(--accent-emerald-border);
            padding: 4px 11px;
            border-radius: 999px;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: -0.01em;
        }
        .case-role-chip {
            font-size: 0.78125rem;
            font-weight: 600;
            color: var(--text-tertiary);
            font-family: 'JetBrains Mono', monospace;
        }
        .case-title {
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            line-height: 1.35;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        .case-headline {
            font-size: 0.96875rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 18px;
            line-height: 1.6;
        }

        /* Terminal Mockup Window */
        .terminal-window {
            background: var(--bg-terminal);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        .terminal-header {
            background: rgba(255, 255, 255, 0.04);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding: 9px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .traffic-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .dot-red { background: #EF4444; }
        .dot-yellow { background: #F59E0B; }
        .dot-green { background: #10B981; }
        .terminal-title {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            margin-left: 6px;
        }
        .terminal-body {
            padding: 14px 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8125rem;
            line-height: 1.65;
            color: #E2E8F0;
            white-space: pre-wrap;
            word-break: break-all;
        }

        /* Key Engineering Achievements */
        .case-bullets {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 22px;
        }
        .case-bullets li {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 0.9375rem;
            line-height: 1.6;
            color: var(--text-secondary);
        }
        .case-bullets li i {
            color: var(--accent-emerald);
            margin-top: 6px;
            font-size: 0.72rem;
            flex-shrink: 0;
        }

        /* Project Metric Tags */
        .case-metrics-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 14px;
            background: var(--bg-surface-elevated);
            border: 1px solid var(--border-surface);
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .metric-item {
            text-align: center;
        }
        .metric-item-val {
            font-size: 1rem;
            font-weight: 800;
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent-emerald);
            line-height: 1.2;
        }
        .metric-item-lbl {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-tertiary);
            margin-top: 3px;
        }

        .case-link-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.90625rem;
            font-weight: 700;
            color: var(--accent-emerald);
            transition: gap .15s;
        }
        .case-link-btn:hover {
            gap: 12px;
        }

        /* ------------------------------------------------------------------
           Honors & Awards (Case Study Dossier Format)
        ------------------------------------------------------------------ */
        .awards-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .award-spotlight-bento {
            padding: 26px 28px;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.08) 0%, rgba(6, 182, 212, 0.04) 100%);
            border: 1px solid var(--accent-emerald-border);
        }
        .award-spotlight-bento:hover {
            box-shadow: 0 16px 36px -4px rgba(16, 185, 129, 0.2);
        }
        .award-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            gap: 10px;
        }
        .award-badge-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 11px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
            background: var(--accent-emerald-tint);
            color: var(--accent-emerald);
            border: 1px solid var(--accent-emerald-border);
            font-family: 'JetBrains Mono', monospace;
        }
        .award-date-tag {
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--text-tertiary);
            font-family: 'JetBrains Mono', monospace;
        }
        .award-spotlight-title {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            margin-bottom: 6px;
        }
        .award-spotlight-desc {
            font-size: 0.9375rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
            line-height: 1.5;
        }
        .award-spotlight-meta {
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--text-tertiary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .award-row-bento {
            padding: 18px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }
        .award-row-left {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
            flex: 1;
        }
        .award-mini-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            background: var(--chip-bg);
            color: var(--text-secondary);
            border: 1px solid var(--chip-border);
            flex-shrink: 0;
        }
        .award-row-details {
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 0;
        }
        .award-row-title-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .award-row-name {
            font-size: 0.96875rem;
            font-weight: 700;
            letter-spacing: -0.015em;
            color: var(--text-primary);
        }
        .award-tag-sm {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 6px;
            background: var(--chip-bg);
            color: var(--text-secondary);
            border: 1px solid var(--chip-border);
            white-space: nowrap;
        }
        .award-row-org {
            font-size: 0.8125rem;
            font-weight: 500;
            color: var(--text-tertiary);
        }

        /* ------------------------------------------------------------------
           Footer
        ------------------------------------------------------------------ */
        footer {
            margin-top: 88px;
            padding: 36px 0 64px;
            border-top: 1px solid var(--border-surface);
            text-align: center;
        }
        footer p {
            font-size: 0.8125rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        /* ------------------------------------------------------------------
           Toast Notification
        ------------------------------------------------------------------ */
        .toast {
            position: fixed;
            left: 50%;
            bottom: 30px;
            transform: translate(-50%, 20px);
            background: var(--text-primary);
            color: var(--bg-page);
            font-size: 0.90625rem;
            font-weight: 600;
            padding: 12px 22px;
            border-radius: 12px;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.3);
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s, transform .2s cubic-bezier(.2,.8,.2,1);
            z-index: 99;
        }
        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        /* ------------------------------------------------------------------
           Scroll Reveal Animation
        ------------------------------------------------------------------ */
        .reveal {
            opacity: 0;
            transform: translateY(16px);
            transition: opacity .5s ease, transform .5s cubic-bezier(.2,.8,.2,1);
        }
        .reveal.in {
            opacity: 1;
            transform: none;
        }

        /* ------------------------------------------------------------------
           Mobile Responsiveness
        ------------------------------------------------------------------ */
        @media (max-width: 767px) {
            .container { padding: 0 18px; }
            .hero { padding-top: 40px; padding-bottom: 32px; }
            section { margin-top: 56px; }
            .metrics-grid { grid-template-columns: repeat(2, 1fr); }
            .tech-bento-grid { grid-template-columns: 1fr; }
            .case-study-card { padding: 22px 18px; }
            .case-metrics-bar { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .hero-ctas .btn { flex: 1; height: 50px; }
            .award-row-bento { padding: 16px 18px; }
        }

        @media (max-width: 480px) {
            .award-row-bento { flex-direction: column; align-items: flex-start; gap: 10px; }
            .award-date-tag { margin-left: 50px; }
        }
    </style>
</head>
<body>
    <!-- Top Navigation -->
    <nav class="topbar">
        <div class="inner">
            <a href="#" class="brand-link">
                <div class="brand-avatar">YW</div>
                <span class="brand-handle" id="navName">@iamywl</span>
            </a>
            <div class="nav-actions">
                <button class="icon-btn" id="themeToggle" title="테마 전환"><i class="fas fa-moon"></i></button>
                <button class="icon-btn" id="navCopy" title="이메일 복사"><i class="fas fa-envelope"></i></button>
                <a class="icon-btn" id="navGithub" target="_blank" rel="noopener" title="GitHub"><i class="fab fa-github"></i></a>
            </div>
        </div>
    </nav>

    <div class="container" id="app"></div>
    <div class="toast" id="toast"></div>

    <script src="js/data.js?v=14"></script>
    <script>
        // 테마 관리 (다크모드 기본 & 시스템 연동)
        const initTheme = () => {
            const saved = localStorage.getItem('theme');
            if (saved) {
                document.documentElement.setAttribute('data-theme', saved);
            } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
            updateThemeIcon();
        };

        const updateThemeIcon = () => {
            const current = document.documentElement.getAttribute('data-theme');
            const isLight = current === 'light';
            const icon = document.querySelector('#themeToggle i');
            if (icon) {
                icon.className = isLight ? 'fas fa-sun' : 'fas fa-moon';
            }
        };

        document.getElementById('themeToggle')?.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            updateThemeIcon();
        });

        initTheme();

        document.addEventListener('DOMContentLoaded', () => {
            const app = document.getElementById('app');
            if (typeof resumeData === 'undefined') {
                app.innerHTML = '<p style="text-align:center;padding:80px 0;color:#94A3B8">데이터를 불러올 수 없습니다. (js/data.js 확인 필요)</p>';
                return;
            }
            const d = resumeData;
            const esc = (s) => String(s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
            const paragraphs = (d.profile.fullIntro || '')
                .split('\n').map(l => l.trim()).filter(Boolean);

            document.getElementById('navName').textContent = '@' + d.profile.github;
            document.getElementById('navGithub').href = 'https://github.com/' + d.profile.github;

            app.innerHTML = `
                <!-- 1. Hero Section -->
                <header class="hero reveal">
                    <div>
                        <span class="status-badge">
                            <span class="status-dot"></span> ${esc(d.profile.status)}
                        </span>
                    </div>
                    <h1 class="hero-title">${esc(d.profile.name)}</h1>
                    <p class="hero-statement">
                        <span class="gradient-text">${esc(d.profile.headline)}</span>
                    </p>
                    <p class="hero-bio">${esc(d.profile.summary)}</p>
                    <div class="hero-ctas">
                        <a class="btn btn-primary" href="https://github.com/${esc(d.profile.github)}" target="_blank" rel="noopener">
                            <i class="fab fa-github"></i> GitHub 프로필
                        </a>
                        <button class="btn btn-secondary" id="copyEmail" data-email="${esc(d.profile.email)}">
                            <i class="fas fa-envelope"></i> 이메일 복사
                        </button>
                        <a class="btn btn-secondary" href="#projects">
                            <i class="fas fa-code-branch"></i> 프로젝트 둘러보기
                        </a>
                    </div>
                </header>

                <!-- 2. Key Metrics Bento -->
                ${Array.isArray(d.stats) && d.stats.length ? `
                <section class="reveal">
                    <div class="metrics-grid">
                        ${d.stats.map(s => `
                            <div class="metric-card bento-card">
                                <div class="metric-val mono">${esc(s.value)}</div>
                                <div class="metric-lbl">${esc(s.label)}</div>
                            </div>
                        `).join('')}
                    </div>
                </section>` : ''}

                <!-- 3. Tech Stacks Bento (Role-Based Architecture) -->
                ${Array.isArray(d.techBento) && d.techBento.length ? `
                <section class="reveal">
                    <div class="section-header">
                        <div>
                            <span class="section-eyebrow"><i class="fas fa-cubes-stacked"></i> Technical Arsenal</span>
                            <h2 class="section-title">스택 벤토 그리드 (Role-Based Architecture)</h2>
                        </div>
                    </div>
                    <div class="tech-bento-grid">
                        ${d.techBento.map(group => `
                            <div class="tech-bento-card bento-card">
                                <div class="tech-bento-head">
                                    <div class="tech-bento-title-wrap">
                                        <div class="tech-bento-icon"><i class="${esc(group.icon)}"></i></div>
                                        <h3 class="tech-bento-title">${esc(group.category)}</h3>
                                    </div>
                                </div>
                                <p class="tech-bento-desc">${esc(group.roleDescription)}</p>
                                <div class="tech-items-flow">
                                    ${group.items.map(it => `
                                        <div class="tech-stack-row">
                                            <span class="tech-stack-name">${esc(it.name)}</span>
                                            <span class="tech-stack-context">${esc(it.context)}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </section>` : ''}

                <!-- 4. Featured Projects (Case Study Format) -->
                <section class="reveal" id="projects">
                    <div class="section-header">
                        <div>
                            <span class="section-eyebrow"><i class="fas fa-terminal"></i> Production Showcases</span>
                            <h2 class="section-title">핵심 프로젝트 케이스 스터디</h2>
                        </div>
                        <span class="section-counter">${d.projects.length} PROJECTS</span>
                    </div>
                    <div class="project-feed">
                        ${d.projects.map(pj => `
                            <article class="case-study-card bento-card">
                                <div class="case-meta-row">
                                    <span class="case-domain-badge">${esc(pj.domain)}</span>
                                    <span class="case-role-chip">${esc(pj.role)} · ${esc(pj.period)}</span>
                                </div>
                                <h3 class="case-title">${esc(pj.title)}</h3>
                                <p class="case-headline">${esc(pj.headline)}</p>

                                <!-- Visual Terminal Mockup -->
                                ${pj.terminalSnippet ? `
                                <div class="terminal-window">
                                    <div class="terminal-header">
                                        <span class="traffic-dot dot-red"></span>
                                        <span class="traffic-dot dot-yellow"></span>
                                        <span class="traffic-dot dot-green"></span>
                                        <span class="terminal-title">bash — production verification</span>
                                    </div>
                                    <div class="terminal-body">${esc(pj.terminalSnippet)}</div>
                                </div>
                                ` : ''}

                                <p style="font-size: 0.90625rem; color: var(--text-tertiary); margin-bottom: 14px; line-height: 1.65;">
                                    <b>Problem Context:</b> ${esc(pj.problem)}
                                </p>

                                <!-- Key Engineering Achievements -->
                                <ul class="case-bullets">
                                    ${pj.points.map(pt => `
                                        <li><i class="fas fa-check"></i><span>${esc(pt)}</span></li>
                                    `).join('')}
                                </ul>

                                <!-- Metrics Bar -->
                                ${Array.isArray(pj.metrics) && pj.metrics.length ? `
                                <div class="case-metrics-bar">
                                    ${pj.metrics.map(m => `
                                        <div class="metric-item">
                                            <div class="metric-item-val">${esc(m.value)}</div>
                                            <div class="metric-item-lbl">${esc(m.label)}</div>
                                        </div>
                                    `).join('')}
                                </div>
                                ` : ''}

                                ${pj.link && pj.link !== '#' ? `
                                <a class="case-link-btn" href="${esc(pj.link)}" target="_blank" rel="noopener">
                                    Explore GitHub Repository <i class="fas fa-arrow-right"></i>
                                </a>
                                ` : ''}
                            </article>
                        `).join('')}
                    </div>
                </section>

                <!-- 5. Honors & Engineering Awards -->
                <section class="reveal" id="awards">
                    <div class="section-header">
                        <div>
                            <span class="section-eyebrow"><i class="fas fa-trophy"></i> Verified Track Record</span>
                            <h2 class="section-title">공식 수상 및 연구 성과</h2>
                        </div>
                        <span class="section-counter">${d.awards.length} AWARDS</span>
                    </div>
                    <div class="awards-stack">
                        ${d.awards.map((aw, idx) => {
                            if (aw.featured || idx === 0) {
                                return `
                                <div class="award-spotlight-bento bento-card">
                                    <div class="award-top-row">
                                        <span class="award-badge-pill">${esc(aw.badge)}</span>
                                        <span class="award-date-tag">${esc(aw.date)}</span>
                                    </div>
                                    <h3 class="award-spotlight-title">${esc(aw.title)}</h3>
                                    <p class="award-spotlight-desc">${esc(aw.desc)}</p>
                                    <div class="award-spotlight-meta">
                                        <i class="fas fa-building" style="opacity: 0.75;"></i> ${esc(aw.org)} · <span class="mono" style="color: var(--accent-emerald);">${esc(aw.metrics)}</span>
                                    </div>
                                </div>
                                `;
                            } else {
                                return `
                                <div class="award-row-bento bento-card">
                                    <div class="award-row-left">
                                        <div class="award-mini-icon"><i class="fas fa-award"></i></div>
                                        <div class="award-row-details">
                                            <div class="award-row-title-wrap">
                                                <span class="award-row-name">${esc(aw.title)}</span>
                                                <span class="award-tag-sm mono">${esc(aw.badge)}</span>
                                            </div>
                                            <div class="award-row-org">${esc(aw.org)} · ${esc(aw.desc)}</div>
                                        </div>
                                    </div>
                                    <span class="award-date-tag">${esc(aw.date)}</span>
                                </div>
                                `;
                            }
                        }).join('')}
                    </div>
                </section>

                <!-- 6. About & Architecture Philosophy -->
                <section class="reveal">
                    <div class="section-header">
                        <div>
                            <span class="section-eyebrow"><i class="fas fa-compass"></i> Engineering Creed</span>
                            <h2 class="section-title">아키텍처 철학 (Architecture Philosophy)</h2>
                        </div>
                    </div>
                    <div class="bento-card" style="padding: 30px;">
                        <h3 style="font-size: 1.2rem; font-weight: 700; margin-bottom: 16px; color: var(--text-primary); line-height: 1.5;">
                            "측정할 수 없는 시스템은 방어할 수 없고, 코드로 선언되지 않은 인프라는 신뢰할 수 없습니다."
                        </h3>
                        <div style="display: flex; flex-direction: column; gap: 14px; font-size: 0.96875rem; color: var(--text-secondary); line-height: 1.8;">
                            ${paragraphs.map(p => `<p>${esc(p)}</p>`).join('')}
                        </div>
                    </div>
                </section>

                <!-- Footer -->
                <footer>
                    <p>Last Deployed · <span id="deploy-timestamp" class="mono">2026-10-19T13:25:27Z</span></p>
                    <p>© 2026 @${esc(d.profile.github)}. Award-Winning Modern Bento &amp; Minimalist Portfolio.</p>
                </footer>
            `;

            // 토스트 클립보드 복사 이벤트
            const toast = document.getElementById('toast');
            let toastTimer;
            const showToast = (msg) => {
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
            };
            const copyEmail = async (email) => {
                try {
                    await navigator.clipboard.writeText(email);
                    showToast('이메일 주소를 복사했습니다 ✓');
                } catch {
                    showToast(email);
                }
            };
            document.getElementById('copyEmail')?.addEventListener('click', e => copyEmail(e.currentTarget.dataset.email));
            document.getElementById('navCopy')?.addEventListener('click', () => copyEmail(d.profile.email));

            // 스크롤 리빌 (Intersection Observer)
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                const io = new IntersectionObserver((entries) => {
                    entries.forEach(e => {
                        if (e.isIntersecting) {
                            e.target.classList.add('in');
                            io.unobserve(e.target);
                        }
                    });
                }, { threshold: 0.08 });
                document.querySelectorAll('.reveal').forEach(el => io.observe(el));
            } else {
                document.querySelectorAll('.reveal').forEach(el => el.classList.add('in'));
            }
        });
    </script>
</body>
</html>
