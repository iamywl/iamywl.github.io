<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>iamywl · Infrastructure &amp; Security Architect</title>
    <meta name="description" content="Linux Kernel 6.x & eBPF, Kubernetes Multi-Cluster, Cloud Native & DevSecOps를 연구하는 시스템 아키텍트 iamywl의 포트폴리오">

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        :root {
            /* Toss & Apple Primary Tokens */
            --brand: #3182F6;
            --brand-strong: #1B64DA;
            --brand-ink: #1B64DA;
            --brand-tint: #EFF6FF;
            --brand-border: #DBEAFE;

            /* Light Theme: Apple Platinum & Toss TDS Pure White */
            --bg-base: #F8FAFC;
            --bg-gradient: radial-gradient(55rem 45rem at 20% -5%, rgba(49, 130, 246, 0.08), transparent 60%),
                           radial-gradient(50rem 40rem at 85% 15%, rgba(99, 102, 241, 0.05), transparent 55%),
                           radial-gradient(40rem 40rem at 50% 95%, rgba(6, 182, 212, 0.05), transparent 60%);

            --glass-bg: rgba(255, 255, 255, 0.94);
            --glass-border: rgba(226, 232, 240, 0.88);
            --glass-shadow: 0 1px 3px rgba(0, 0, 0, 0.02), 0 8px 24px -4px rgba(15, 23, 42, 0.05);
            --glass-hover-shadow: 0 14px 34px -4px rgba(49, 130, 246, 0.12), 0 4px 12px -2px rgba(15, 23, 42, 0.03);
            --glass-hover-border: rgba(49, 130, 246, 0.38);

            --ink-primary: #0F172A;
            --ink-secondary: #334155;
            --ink-tertiary: #64748B;
            --ink-muted: #94A3B8;

            --topbar-bg: rgba(248, 250, 252, 0.88);

            --chip-bg: #F1F5F9;
            --chip-border: #E2E8F0;
            --chip-text: #475569;

            --pill-accent-bg: #EFF6FF;
            --pill-accent-border: #DBEAFE;
            --pill-accent-text: #2563EB;

            --featured-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.98) 0%, rgba(254, 250, 238, 0.94) 100%);
            --featured-border: #FDE68A;
            --featured-shadow: 0 12px 32px -4px rgba(245, 158, 11, 0.14), 0 2px 8px -1px rgba(15, 23, 42, 0.03);
        }

        [data-theme="dark"] {
            --brand: #38BDF8;
            --brand-strong: #0284C7;
            --brand-ink: #58A6FF;
            --brand-tint: rgba(56, 189, 248, 0.12);
            --brand-border: rgba(56, 189, 248, 0.25);

            /* Dark Theme: VisionOS Obsidian */
            --bg-base: #0B0F19;
            --bg-gradient: radial-gradient(55rem 45rem at 20% -5%, rgba(49, 130, 246, 0.15), transparent 60%),
                           radial-gradient(50rem 40rem at 85% 15%, rgba(99, 102, 241, 0.10), transparent 55%),
                           radial-gradient(40rem 40rem at 50% 95%, rgba(6, 182, 212, 0.08), transparent 60%);

            --glass-bg: rgba(22, 27, 34, 0.85);
            --glass-border: rgba(255, 255, 255, 0.09);
            --glass-shadow: 0 8px 24px -2px rgba(0, 0, 0, 0.45);
            --glass-hover-shadow: 0 16px 36px -4px rgba(49, 130, 246, 0.25), 0 4px 12px -2px rgba(0, 0, 0, 0.4);
            --glass-hover-border: rgba(56, 189, 248, 0.4);

            --ink-primary: #F8FAFC;
            --ink-secondary: #CBD5E1;
            --ink-tertiary: #94A3B8;
            --ink-muted: #64748B;

            --topbar-bg: rgba(11, 15, 25, 0.88);

            --chip-bg: rgba(255, 255, 255, 0.06);
            --chip-border: rgba(255, 255, 255, 0.1);
            --chip-text: #CBD5E1;

            --pill-accent-bg: rgba(56, 189, 248, 0.12);
            --pill-accent-border: rgba(56, 189, 248, 0.25);
            --pill-accent-text: #38BDF8;

            --featured-bg: linear-gradient(135deg, rgba(27, 38, 59, 0.92) 0%, rgba(46, 35, 15, 0.82) 100%);
            --featured-border: #78350F;
            --featured-shadow: 0 12px 32px -4px rgba(245, 158, 11, 0.2), 0 2px 8px -1px rgba(0, 0, 0, 0.5);
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --brand: #38BDF8;
                --brand-strong: #0284C7;
                --brand-ink: #58A6FF;
                --brand-tint: rgba(56, 189, 248, 0.12);
                --brand-border: rgba(56, 189, 248, 0.25);

                --bg-base: #0B0F19;
                --bg-gradient: radial-gradient(55rem 45rem at 20% -5%, rgba(49, 130, 246, 0.15), transparent 60%),
                               radial-gradient(50rem 40rem at 85% 15%, rgba(99, 102, 241, 0.10), transparent 55%),
                               radial-gradient(40rem 40rem at 50% 95%, rgba(6, 182, 212, 0.08), transparent 60%);

                --glass-bg: rgba(22, 27, 34, 0.85);
                --glass-border: rgba(255, 255, 255, 0.09);
                --glass-shadow: 0 8px 24px -2px rgba(0, 0, 0, 0.45);
                --glass-hover-shadow: 0 16px 36px -4px rgba(49, 130, 246, 0.25), 0 4px 12px -2px rgba(0, 0, 0, 0.4);
                --glass-hover-border: rgba(56, 189, 248, 0.4);

                --ink-primary: #F8FAFC;
                --ink-secondary: #CBD5E1;
                --ink-tertiary: #94A3B8;
                --ink-muted: #64748B;

                --topbar-bg: rgba(11, 15, 25, 0.88);

                --chip-bg: rgba(255, 255, 255, 0.06);
                --chip-border: rgba(255, 255, 255, 0.1);
                --chip-text: #CBD5E1;

                --pill-accent-bg: rgba(56, 189, 248, 0.12);
                --pill-accent-border: rgba(56, 189, 248, 0.25);
                --pill-accent-text: #38BDF8;

                --featured-bg: linear-gradient(135deg, rgba(27, 38, 59, 0.92) 0%, rgba(46, 35, 15, 0.82) 100%);
                --featured-border: #78350F;
                --featured-shadow: 0 12px 32px -4px rgba(245, 158, 11, 0.2), 0 2px 8px -1px rgba(0, 0, 0, 0.5);
            }
        }

        /* Universal Korean Typography & Layout Reset */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", sans-serif;
            color: var(--ink-primary);
            line-height: 1.7;
            letter-spacing: -0.02em;
            word-break: keep-all;
            overflow-wrap: break-word;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            background-color: var(--bg-base);
            background-image: var(--bg-gradient);
            background-repeat: no-repeat;
            background-attachment: fixed;
            transition: background-color .3s ease, color .3s ease;
            overflow-x: hidden;
        }

        a { color: inherit; text-decoration: none; }
        p, h1, h2, h3, h4, span, li {
            word-break: keep-all;
            overflow-wrap: break-word;
        }

        .wrap {
            max-width: 780px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ---------- Toss TDS Glass Container Base ---------- */
        .glass-card {
            background: var(--glass-bg);
            -webkit-backdrop-filter: saturate(180%) blur(24px);
            backdrop-filter: saturate(180%) blur(24px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: 20px;
            transition: transform .22s cubic-bezier(.16,1,.3,1), box-shadow .22s, border-color .22s;
        }

        /* ---------- Sticky Header Topbar ---------- */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 50;
            background: var(--topbar-bg);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid var(--glass-border);
            transition: background .3s;
        }
        .topbar .inner {
            max-width: 780px;
            margin: 0 auto;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .brand-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand-name {
            font-weight: 800;
            font-size: 1.05rem;
            letter-spacing: -0.03em;
            color: var(--ink-primary);
        }
        .status-beacon {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            color: #10B981;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.25);
            padding: 2px 9px;
            border-radius: 999px;
            letter-spacing: -0.01em;
        }
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10B981;
            box-shadow: 0 0 6px rgba(16, 185, 129, 0.8);
            animation: pulseDot 2s infinite ease-in-out;
        }
        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        .topbar .nav-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            color: var(--ink-primary);
            transition: transform .15s cubic-bezier(.2,.8,.2,1), background-color .15s, color .15s, border-color .15s;
            -webkit-tap-highlight-color: transparent;
            cursor: pointer;
            border: 1px solid transparent;
            background: transparent;
        }
        .icon-btn:hover {
            background: var(--brand-tint);
            color: var(--brand);
            border-color: var(--brand-border);
        }
        .icon-btn:active {
            transform: scale(.92);
        }

        /* ---------- Section Headers ---------- */
        section {
            margin-top: 68px;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 20px;
        }
        .eyebrow {
            font-size: 0.8125rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--brand-ink);
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }
        .section-counter {
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--ink-tertiary);
        }

        /* ---------- Hero Section ---------- */
        header.hero {
            padding-top: 72px;
            text-align: center;
        }
        .hero-status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 0.78125rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            background: rgba(16, 185, 129, 0.12);
            color: #059669;
            border: 1px solid rgba(16, 185, 129, 0.3);
            margin-bottom: 20px;
        }
        [data-theme="dark"] .hero-status-pill,
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) .hero-status-pill {
                background: rgba(16, 185, 129, 0.15);
                color: #34D399;
                border-color: rgba(52, 211, 153, 0.35);
            }
        }
        .hero h1 {
            font-size: clamp(2.8rem, 7vw, 4rem);
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 1.05;
            margin-bottom: 12px;
            color: var(--ink-primary);
        }
        .hero .subtitle {
            font-size: clamp(1.2rem, 3vw, 1.5rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--brand-ink);
            margin-bottom: 14px;
        }
        .hero .lead {
            font-size: clamp(1rem, 2.5vw, 1.15rem);
            font-weight: 500;
            letter-spacing: -0.015em;
            line-height: 1.6;
            color: var(--ink-secondary);
            max-width: 44ch;
            margin: 0 auto 32px;
        }
        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 48px;
            padding: 0 24px;
            border-radius: 14px;
            font-size: 0.9375rem;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid transparent;
            transition: transform .15s cubic-bezier(.2,.8,.2,1), background-color .15s, border-color .15s, box-shadow .15s;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active {
            transform: scale(.97);
        }
        .btn-primary {
            background: var(--brand);
            color: #fff;
            box-shadow: 0 8px 20px rgba(49, 130, 246, 0.28);
        }
        .btn-primary:hover {
            background: var(--brand-strong);
            box-shadow: 0 10px 24px rgba(49, 130, 246, 0.38);
        }
        .btn-ghost {
            background: var(--glass-bg);
            color: var(--ink-primary);
            border-color: var(--glass-border);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
        }
        .btn-ghost:hover {
            border-color: var(--brand-border);
            background: var(--brand-tint);
            color: var(--brand);
        }

        /* ---------- Telemetry Stats Grid (Rock-Solid 4 Cards) ---------- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        .stat-card {
            padding: 22px 14px;
            text-align: center;
        }
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--glass-hover-shadow);
        }
        .stat-card .num {
            font-size: clamp(1.75rem, 4vw, 2.3rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.1;
            color: var(--brand);
            display: block;
            margin-bottom: 8px;
        }
        .stat-card .lbl {
            font-size: 0.78125rem;
            font-weight: 600;
            color: var(--ink-secondary);
            line-height: 1.35;
        }

        /* ---------- About Section ---------- */
        .about-card {
            padding: 32px;
        }
        .about-lead {
            font-size: clamp(1.15rem, 2.8vw, 1.35rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.55;
            color: var(--ink-primary);
            margin-bottom: 20px;
        }
        .about-body p {
            font-size: 1rem;
            font-weight: 400;
            line-height: 1.8;
            color: var(--ink-secondary);
            margin-bottom: 16px;
        }
        .about-body p:last-child {
            margin-bottom: 0;
        }

        /* ---------- Project Cards (Zero Text Overflow Guaranteed) ---------- */
        .project-card {
            padding: 28px;
        }
        .project-card + .project-card {
            margin-top: 18px;
        }
        .project-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--glass-hover-shadow);
            border-color: var(--glass-hover-border);
        }
        .project-top-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        .domain-badge {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--brand-ink);
            background: var(--pill-accent-bg);
            border: 1px solid var(--pill-accent-border);
            padding: 3px 10px;
            border-radius: 999px;
            white-space: nowrap;
        }
        .period-chip {
            font-size: 0.78125rem;
            font-weight: 600;
            color: var(--chip-text);
            background: var(--chip-bg);
            border: 1px solid var(--chip-border);
            padding: 3px 10px;
            border-radius: 999px;
            white-space: nowrap;
        }
        .project-title {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.35;
            color: var(--ink-primary);
            margin-bottom: 8px;
        }
        .project-desc {
            font-size: 0.96875rem;
            font-weight: 600;
            color: var(--ink-secondary);
            margin-bottom: 18px;
            line-height: 1.55;
        }
        .project-points {
            list-style: none;
            display: grid;
            gap: 10px;
            margin-bottom: 20px;
        }
        .project-points li {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 0.9375rem;
            line-height: 1.6;
            color: var(--ink-secondary);
        }
        .project-points li i {
            color: var(--brand);
            margin-top: 6px;
            font-size: 0.72rem;
            flex-shrink: 0;
        }
        .repo-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.90625rem;
            font-weight: 700;
            color: var(--brand);
            transition: gap .15s;
        }
        .repo-link:hover {
            gap: 12px;
            color: var(--brand-strong);
        }

        /* ---------- Honors & Awards (Toss Elevated Feed Style) ---------- */
        .awards-feed {
            display: grid;
            gap: 14px;
        }

        /* Spotlight Award Card (Google AI Agent Challenge) */
        .award-spotlight-card {
            background: var(--featured-bg);
            border: 1px solid var(--featured-border);
            box-shadow: var(--featured-shadow);
            border-radius: 20px;
            padding: 26px 28px;
            transition: transform .22s cubic-bezier(.16,1,.3,1), box-shadow .22s;
        }
        .award-spotlight-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 36px -4px rgba(245, 158, 11, 0.22);
        }
        .spotlight-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }
        .spotlight-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 11px;
            border-radius: 999px;
            font-size: 0.78125rem;
            font-weight: 700;
            background: #FEF3C7;
            color: #92400E;
            border: 1px solid #FDE68A;
        }
        [data-theme="dark"] .spotlight-pill {
            background: rgba(245, 158, 11, 0.18);
            color: #FBBF24;
            border-color: rgba(245, 158, 11, 0.35);
        }
        .spotlight-date {
            font-size: 0.8125rem;
            font-weight: 700;
            color: var(--brand-ink);
            background: var(--pill-accent-bg);
            border: 1px solid var(--pill-accent-border);
            padding: 4px 12px;
            border-radius: 999px;
            white-space: nowrap;
        }
        .spotlight-main {
            display: flex;
            gap: 16px;
            align-items: flex-start;
        }
        .spotlight-icon-box {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            flex-shrink: 0;
            background: linear-gradient(135deg, #FEF3C7, #FDE68A);
            border: 1px solid #F59E0B;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.25);
        }
        .spotlight-content {
            flex: 1;
            min-width: 0;
        }
        .spotlight-title {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.35;
            color: var(--ink-primary);
            margin-bottom: 6px;
        }
        .spotlight-desc {
            font-size: 0.90625rem;
            font-weight: 500;
            color: var(--ink-secondary);
            line-height: 1.5;
            margin-bottom: 8px;
        }
        .spotlight-org {
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--ink-tertiary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Clean List Cards for Other Awards */
        .award-row-card {
            padding: 18px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }
        .award-row-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--glass-hover-shadow);
            border-color: var(--glass-hover-border);
        }
        .award-row-left {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
            flex: 1;
        }
        .award-row-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            flex-shrink: 0;
            background: var(--pill-accent-bg);
            border: 1px solid var(--pill-accent-border);
        }
        .award-row-details {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }
        .award-row-title-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .award-row-title {
            font-size: 0.96875rem;
            font-weight: 700;
            letter-spacing: -0.015em;
            line-height: 1.35;
            color: var(--ink-primary);
        }
        .award-badge-tag {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 0.71875rem;
            font-weight: 700;
            background: #FEF3C7;
            color: #92400E;
            border: 1px solid #FDE68A;
            white-space: nowrap;
        }
        [data-theme="dark"] .award-badge-tag {
            background: rgba(245, 158, 11, 0.18);
            color: #FBBF24;
            border-color: rgba(245, 158, 11, 0.35);
        }
        .award-row-org {
            font-size: 0.8125rem;
            font-weight: 500;
            color: var(--ink-tertiary);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .award-row-date {
            font-size: 0.78125rem;
            font-weight: 700;
            color: var(--brand-ink);
            background: var(--pill-accent-bg);
            border: 1px solid var(--pill-accent-border);
            padding: 4px 11px;
            border-radius: 999px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* ---------- Technical Arsenal (Bento Architecture) ---------- */
        .bento-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        .bento-card {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .bento-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--glass-hover-shadow);
        }
        .bento-header {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .bento-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--brand-tint);
            color: var(--brand);
            border: 1px solid var(--brand-border);
            font-size: 1rem;
            flex-shrink: 0;
        }
        .bento-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--ink-primary);
            letter-spacing: -0.015em;
        }
        .bento-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .tech-pill {
            display: inline-flex;
            align-items: center;
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--chip-text);
            background: var(--chip-bg);
            border: 1px solid var(--chip-border);
            padding: 5px 11px;
            border-radius: 8px;
            white-space: nowrap;
        }

        /* ---------- Footer ---------- */
        footer {
            margin-top: 84px;
            padding: 28px 0 56px;
            text-align: center;
        }
        footer p {
            font-size: 0.8125rem;
            color: var(--ink-tertiary);
            margin-bottom: 6px;
        }

        /* ---------- Toast Notification ---------- */
        .toast {
            position: fixed;
            left: 50%;
            bottom: 28px;
            transform: translate(-50%, 20px);
            background: rgba(15, 23, 42, 0.94);
            color: #fff;
            font-size: 0.9375rem;
            font-weight: 600;
            padding: 13px 22px;
            border-radius: 14px;
            box-shadow: 0 12px 32px rgba(11, 18, 32, 0.3);
            -webkit-backdrop-filter: saturate(180%) blur(12px);
            backdrop-filter: saturate(180%) blur(12px);
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s, transform .25s cubic-bezier(.2,.8,.2,1);
            z-index: 99;
        }
        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        /* ---------- Scroll Reveal ---------- */
        .reveal {
            opacity: 0;
            transform: translateY(16px);
            transition: opacity .6s ease, transform .6s cubic-bezier(.2,.8,.2,1);
        }
        .reveal.in {
            opacity: 1;
            transform: none;
        }

        /* ---------- Responsive Breakpoints ---------- */
        @media (max-width: 767px) {
            .wrap {
                padding: 0 18px;
            }
            .topbar .inner {
                padding: 10px 18px;
            }
            header.hero {
                padding-top: 48px;
            }
            section {
                margin-top: 52px;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .bento-grid {
                grid-template-columns: 1fr;
            }
            .hero-actions .btn {
                flex: 1;
                height: 50px;
            }
            .about-card, .project-card, .award-spotlight-card {
                padding: 22px 20px;
            }
            .award-row-card {
                padding: 16px 18px;
            }
            .spotlight-main {
                flex-direction: column;
                gap: 12px;
            }
            body {
                background-attachment: scroll;
            }
        }

        @media (max-width: 480px) {
            .award-row-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            .award-row-left {
                width: 100%;
            }
            .award-row-date {
                align-self: flex-start;
                margin-left: 56px;
            }
            .project-top-meta {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
        }

        /* ---------- Accessibility & Fallbacks ---------- */
        @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
            .glass-card, .topbar, .btn-ghost { background: #fff; }
        }
        @media (prefers-reduced-transparency: reduce) {
            .glass-card { background: #fff; backdrop-filter: none; -webkit-backdrop-filter: none; }
            .topbar { background: var(--bg-base); backdrop-filter: none; }
            .toast { backdrop-filter: none; background: #0B1220; }
        }
        @media (prefers-reduced-motion: reduce) {
            * { scroll-behavior: auto !important; }
            .reveal { opacity: 1 !important; transform: none !important; transition: none; }
            .btn:active, .project-card:hover, .bento-card:hover, .icon-btn:active, .stat-card:hover, .award-spotlight-card:hover, .award-row-card:hover { transform: none; }
        }
    </style>
</head>
<body>
    <nav class="topbar">
        <div class="inner">
            <div class="brand-group">
                <span class="brand-name" id="navName">iamywl</span>
                <span class="status-beacon"><span class="status-dot"></span> Operational</span>
            </div>
            <div class="nav-actions">
                <button class="icon-btn" id="themeToggle" title="테마 변경"><i class="fas fa-moon"></i></button>
                <button class="icon-btn" id="navCopy" title="이메일 복사"><i class="fas fa-envelope"></i></button>
                <a class="icon-btn" id="navGithub" target="_blank" rel="noopener" title="GitHub"><i class="fab fa-github"></i></a>
            </div>
        </div>
    </nav>

    <div class="wrap" id="app"></div>
    <div class="toast" id="toast"></div>

    <script src="js/data.js?v=11"></script>
    <script>
        // 테마 관리 (Light / Dark)
        const initTheme = () => {
            const saved = localStorage.getItem('theme');
            if (saved) {
                document.documentElement.setAttribute('data-theme', saved);
            }
            updateThemeIcon();
        };

        const updateThemeIcon = () => {
            const current = document.documentElement.getAttribute('data-theme');
            const isDark = current === 'dark' || (!current && window.matchMedia('(prefers-color-scheme: dark)').matches);
            const icon = document.querySelector('#themeToggle i');
            if (icon) {
                icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
            }
        };

        document.getElementById('themeToggle')?.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            const isDark = current === 'dark' || (!current && window.matchMedia('(prefers-color-scheme: dark)').matches);
            const next = isDark ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            updateThemeIcon();
        });

        initTheme();

        document.addEventListener('DOMContentLoaded', () => {
            const app = document.getElementById('app');
            if (typeof resumeData === 'undefined') {
                app.innerHTML = '<p style="text-align:center;padding:80px 0;color:#64748B">데이터를 불러올 수 없어요. (js/data.js 확인 필요)</p>';
                return;
            }
            const d = resumeData;
            const esc = (s) => String(s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
            const paragraphs = (d.profile.fullIntro || '')
                .split('\n').map(l => l.trim()).filter(Boolean);

            // 상단바 바인딩
            document.getElementById('navName').textContent = '@' + d.profile.github;
            document.getElementById('navGithub').href = 'https://github.com/' + d.profile.github;

            app.innerHTML = `
                <!-- 1. Hero Section -->
                <header class="hero reveal">
                    <div>
                        <span class="hero-status-pill">
                            <i class="fas fa-circle-dot" style="font-size: 0.65rem;"></i> ${esc(d.profile.status || 'System Operational · Ready to Deploy')}
                        </span>
                    </div>
                    <h1>${esc(d.profile.name)}</h1>
                    <p class="subtitle">${esc(d.profile.title)}</p>
                    <p class="lead">${esc(d.profile.keyword)}</p>
                    <div class="hero-actions">
                        <button class="btn btn-primary" id="copyEmail" data-email="${esc(d.profile.email)}">
                            <i class="fas fa-envelope"></i> 이메일 복사
                        </button>
                        <a class="btn btn-ghost" href="https://github.com/${esc(d.profile.github)}" target="_blank" rel="noopener">
                            <i class="fab fa-github"></i> GitHub 프로필
                        </a>
                    </div>
                </header>

                <!-- 2. Impact Telemetry Stats -->
                ${Array.isArray(d.stats) && d.stats.length ? `
                <section class="reveal">
                    <div class="stats-grid">
                        ${d.stats.map(s => `
                            <div class="stat-card glass-card">
                                <span class="num">${esc(s.value)}</span>
                                <span class="lbl">${esc(s.label)}</span>
                            </div>
                        `).join('')}
                    </div>
                </section>` : ''}

                <!-- 3. About Section -->
                <section class="reveal">
                    <div class="section-header">
                        <p class="eyebrow"><i class="fas fa-terminal"></i> About &amp; Philosophy</p>
                    </div>
                    <div class="about-card glass-card">
                        <p class="about-lead">"${esc(d.profile.summary)}"</p>
                        <div class="about-body">
                            ${paragraphs.map(p => `<p>${esc(p)}</p>`).join('')}
                        </div>
                    </div>
                </section>

                <!-- 4. Flagship Projects -->
                <section class="reveal">
                    <div class="section-header">
                        <p class="eyebrow"><i class="fas fa-code-branch"></i> Flagship Production &amp; Research Showcases</p>
                        <span class="section-counter">프로젝트 ${d.projects.length}건</span>
                    </div>
                    ${d.projects.map(pj => `
                        <article class="project-card glass-card">
                            <div class="project-top-meta">
                                <span class="domain-badge">${esc(pj.badge || 'Engineering')}</span>
                                <span class="period-chip">${esc(pj.period)}</span>
                            </div>
                            <h3 class="project-title">${esc(pj.title)}</h3>
                            <p class="project-desc">${esc(pj.description)}</p>
                            <ul class="project-points">
                                ${pj.points.map(pt => `<li><i class="fas fa-check"></i><span>${esc(pt)}</span></li>`).join('')}
                            </ul>
                            ${pj.link && pj.link !== '#' ? `<a class="repo-link" href="${esc(pj.link)}" target="_blank" rel="noopener">GitHub Repository <i class="fas fa-arrow-right"></i></a>` : ''}
                        </article>
                    `).join('')}
                </section>

                <!-- 5. Honors & Awards (No Text Clipping / Perfect Wrapping) -->
                <section class="reveal">
                    <div class="section-header">
                        <p class="eyebrow"><i class="fas fa-trophy" style="color: #F59E0B;"></i> Honors &amp; Engineering Awards</p>
                        <span class="section-counter">공식 수상 ${d.awards.length}건</span>
                    </div>
                    <div class="awards-feed">
                        ${d.awards.map((aw, idx) => {
                            const isFeatured = aw.featured || idx === 0;
                            if (isFeatured) {
                                return `
                                <div class="award-spotlight-card">
                                    <div class="spotlight-top-row">
                                        <span class="spotlight-pill">${esc(aw.badge || '🏆 우수상')}</span>
                                        <span class="spotlight-date">${esc(aw.date)}</span>
                                    </div>
                                    <div class="spotlight-main">
                                        <div class="spotlight-icon-box">🏆</div>
                                        <div class="spotlight-content">
                                            <h3 class="spotlight-title">${esc(aw.title)}</h3>
                                            ${aw.desc ? `<p class="spotlight-desc">${esc(aw.desc)}</p>` : ''}
                                            <p class="spotlight-org"><i class="fas fa-building" style="font-size: 0.72rem; opacity: 0.75;"></i> ${esc(aw.org)}</p>
                                        </div>
                                    </div>
                                </div>
                                `;
                            } else {
                                return `
                                <div class="award-row-card glass-card">
                                    <div class="award-row-left">
                                        <div class="award-row-icon">${idx === 1 ? '🥇' : '🎖️'}</div>
                                        <div class="award-row-details">
                                            <div class="award-row-title-wrap">
                                                <span class="award-row-title">${esc(aw.title)}</span>
                                                ${aw.badge ? `<span class="award-badge-tag">${esc(aw.badge)}</span>` : ''}
                                            </div>
                                            <p class="award-row-org"><i class="fas fa-building" style="font-size: 0.7rem; opacity: 0.75;"></i> ${esc(aw.org)}</p>
                                        </div>
                                    </div>
                                    <span class="award-row-date">${esc(aw.date)}</span>
                                </div>
                                `;
                            }
                        }).join('')}
                    </div>
                </section>

                <!-- 6. Technical Arsenal (Bento Architecture) -->
                ${Array.isArray(d.techCategories) && d.techCategories.length ? `
                <section class="reveal">
                    <div class="section-header">
                        <p class="eyebrow"><i class="fas fa-cubes-stacked"></i> Technical Arsenal (Bento Architecture)</p>
                    </div>
                    <div class="bento-grid">
                        ${d.techCategories.map(cat => `
                            <div class="bento-card glass-card">
                                <div class="bento-header">
                                    <div class="bento-icon"><i class="${esc(cat.icon)}"></i></div>
                                    <h4 class="bento-title">${esc(cat.category)}</h4>
                                </div>
                                <div class="bento-pills">
                                    ${cat.skills.map(sk => `<span class="tech-pill">${esc(sk)}</span>`).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </section>` : ''}

                <!-- 7. Footer -->
                <footer>
                    <p>Last Deployed · <span id="deploy-timestamp">2026-10-19T13:04:32Z</span></p>
                    <p>© 2026 @${esc(d.profile.github)}. Toss TDS &amp; Apple Platinum Liquid Glass Design System.</p>
                </footer>
            `;

            // 토스트 클립보드 이벤트
            const toast = document.getElementById('toast');
            let toastTimer;
            const showToast = (msg) => {
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
            };
            const copyEmail = async (email) => {
                try {
                    await navigator.clipboard.writeText(email);
                    showToast('이메일을 복사했어요 ✓');
                } catch {
                    showToast(email);
                }
            };
            document.getElementById('copyEmail')?.addEventListener('click', e => copyEmail(e.currentTarget.dataset.email));
            document.getElementById('navCopy')?.addEventListener('click', () => copyEmail(d.profile.email));

            // 스크롤 리빌 애니메이션
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                const io = new IntersectionObserver((entries) => {
                    entries.forEach(e => {
                        if (e.isIntersecting) {
                            e.target.classList.add('in');
                            io.unobserve(e.target);
                        }
                    });
                }, { threshold: 0.08 });
                document.querySelectorAll('.reveal').forEach(el => io.observe(el));
            } else {
                document.querySelectorAll('.reveal').forEach(el => el.classList.add('in'));
            }
        });
    </script>
</body>
</html>
